/* circle play button in My Courses */
.launcher-play{width:28px!important;height:28px!important;background:transparent!important;border-radius:50%}
.lp-ring{fill:var(--surface);stroke:var(--prim-slate-300);stroke-width:1.6;transition:fill .15s,stroke .15s}
.lp-tri{fill:var(--prim-slate-500);transition:fill .15s}
.launcher:hover .launcher-play,.launcher:focus-visible .launcher-play{background:transparent!important}
.launcher:hover .lp-ring,.launcher:focus-visible .lp-ring{fill:var(--subject-ink);stroke:var(--subject-ink)}
.launcher:hover .lp-tri,.launcher:focus-visible .lp-tri{fill:#fff}
.side-sec{padding-right:10px}
.yk-tabs + .k5-quest{margin-top:0}
/* Calendar page: Calendar | Live sessions switch */
.seg-tabs{display:inline-flex;gap:4px;padding:4px;margin-bottom:18px;border-radius:14px;background:var(--prim-slate-100);border:1px solid var(--line)}
.seg-tabs button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 16px;border:0;border-radius:10px;background:transparent;font-weight:700;font-size:14px;color:var(--ink-2)}
.seg-tabs button:hover{color:var(--ink)}
.seg-tabs button.is-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.seg-n{padding:1px 8px;border-radius:99px;background:var(--brand-blue-soft);color:var(--brand-blue-ink);font-size:12px;font-weight:800}
.cal-sessions{margin-top:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Up next: tidy layout, actions on the right, cycling animation */
.upnext{display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:24px 28px}
.upnext-main{flex:1 1 420px;display:flex;align-items:center;gap:20px;min-width:0}
.upnext .upnext-top{display:flex;align-items:center;gap:12px;margin:0 0 4px}
.upnext-dots{display:inline-flex;gap:4px}
.upnext-dots i{width:6px;height:6px;border-radius:99px;background:color-mix(in srgb,var(--subject-ink) 22%,transparent);transition:width .25s,background .25s}
.upnext-dots i.is-on{width:18px;background:var(--subject-ink)}
.upnext .upnext-title{margin:2px 0 8px}
.upnext-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:14px;color:var(--ink-2)}
.upnext-due{font-weight:800}
.upnext-due.due-danger{color:var(--alert-error-dark)}.upnext-due.due-warn{color:var(--alert-warning-dark)}.upnext-due.due-neutral{color:var(--ink)}
.upnext .upnext-actions{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:6px;margin:0;min-width:210px}
.upnext-skip{justify-content:center}
@media (max-width:760px){.upnext .upnext-actions{flex:1 1 100%;flex-direction:row;flex-wrap:wrap}}
@keyframes upOut{to{opacity:0;transform:translateX(-36px)}}
@keyframes upIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
.upnext.is-out .upnext-main{animation:upOut .24s ease-in forwards}
.upnext.is-in .upnext-main{animation:upIn .34s cubic-bezier(.2,.9,.3,1.1)}
.upnext{transition:background .35s}
@media (prefers-reduced-motion:reduce){.upnext.is-out .upnext-main,.upnext.is-in .upnext-main{animation:none}}

/* ===== Horizontal "Live today" timeline ===== */
.lth-card{padding-bottom:16px}
.lth-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px 4px}
.lth{position:relative;min-width:880px}
.lth-axis{position:relative;height:22px;margin-left:0}
.lth-hour{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.lth-hour:first-child{transform:none}
.lth-hour:last-child{transform:translateX(-100%)}
.lth-track{position:relative;height:calc(var(--lanes) * 78px + 14px);border-radius:12px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.lth-grid{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--line)}
.lth-past{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(148,163,184,.10) 0 6px,transparent 6px 12px);transition:width 1s linear}
.lth-bar{position:absolute;height:70px;padding:8px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 3px rgba(15,23,42,.06);display:flex;flex-direction:column;min-width:0;overflow:hidden;transition:opacity .4s,border-color .3s,background .3s}
.lth-bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--prim-admin-blue-400)}
.lth-bar-title{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lth-bar-meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lth-bar-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.lth-bar-foot .tl-badge{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lth-bar .btn-join{min-height:26px;padding:2px 12px;font-size:12.5px}
.lth-bar.is-soon{background:var(--brand-blue-soft);border-color:var(--brand-blue-line)}
.lth-bar.is-live{background:var(--color-accent-color-2-subtle);border-color:var(--live)}
.lth-bar.is-live::before{background:var(--live)}
.lth-bar.is-ended{opacity:.5}
.lth-bar.is-ended::before{background:var(--prim-slate-300)}
.lth-now{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--now);z-index:3;transition:left 1s linear;pointer-events:none}
.lth-now span{position:absolute;top:4px;left:4px;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--live);color:var(--live-ink);white-space:nowrap}

/* ===== Playlist card ===== */
.playlist{padding:0;overflow:hidden}
.pl-top{display:flex;align-items:center;gap:20px;padding:22px 24px;background:linear-gradient(135deg,var(--prim-slate-100),var(--surface) 70%);border-bottom:1px solid var(--line)}
.pl-cover{width:84px;height:84px;flex-shrink:0;border-radius:14px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;box-shadow:0 6px 16px rgba(15,23,42,.15)}
.pl-cover span{display:flex;align-items:center;justify-content:center;background:var(--subject-soft);color:var(--subject-ink);font-family:var(--display);font-weight:800;font-size:13px}
.pl-kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl-title{margin:2px 0;font-family:var(--display);font-weight:900;font-size:clamp(22px,2.4vw,28px);letter-spacing:-.01em}
.pl-sub{font-size:14px;color:var(--ink-2)}
.pl-bigplay{width:60px;height:60px;flex-shrink:0;border:0;border-radius:50%;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .15s}
.pl-bigplay svg{fill:#fff;margin-left:3px}
.pl-bigplay:hover{transform:scale(1.06);background:var(--accent-hover)}
.pl-now{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:14px 14px 4px;padding:16px 18px;border-radius:16px;background:linear-gradient(110deg,var(--subject-soft),var(--surface) 85%);border:2px solid var(--subject);transition:background .35s,border-color .35s}
.pl-now-main{flex:1 1 380px;display:flex;align-items:center;gap:16px;min-width:0}
.pl-eq{display:inline-flex;align-items:flex-end;gap:3px;width:24px;height:22px;flex-shrink:0}
.pl-eq i{width:5px;border-radius:2px;background:var(--subject-ink);animation:eq 1s ease-in-out infinite}
.pl-eq i:nth-child(1){height:40%;animation-delay:-.2s}.pl-eq i:nth-child(2){height:90%;animation-delay:-.5s}.pl-eq i:nth-child(3){height:60%;animation-delay:-.8s}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.pl-eq i{transform-origin:bottom}
.pl-now-tile{width:60px;height:60px;font-size:20px;border-radius:14px;background:var(--surface)}
.pl-now-label{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--subject-ink)}

.hr-bubble.kind-shout-out{background:var(--color-accent-color-6-subtle);border-color:var(--color-accent-color-6-light);box-shadow:0 4px 0 var(--color-accent-color-6-light)}
.hr-bubble.kind-reminder{background:var(--brand-blue-soft);border-color:var(--brand-blue-line);box-shadow:0 4px 0 var(--brand-blue-line)}
.hr-msg-foot{display:flex;align-items:center;gap:12px;padding-left:8px}
.hr-time{font-size:13px;color:var(--muted)}
.hr-heart{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:4px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;color:var(--ink-2)}
.hr-heart:hover{border-color:var(--color-accent-color-6-base)}
.hr-heart.is-on{border-color:var(--color-accent-color-6-base);background:var(--color-accent-color-6-subtle);color:var(--color-accent-color-6-darker)}
.hr-heart.is-on svg{fill:var(--color-accent-color-6-base)}

/* ===== Homeroom wheel ===== */
.hrw{position:relative;outline:none;border-radius:28px}
.hrw:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.hrw-stage{position:relative;height:520px;perspective:1100px;perspective-origin:50% 50%;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 18%,#000 82%,transparent 100%)}
.hrw-card{position:absolute;left:50%;top:50%;width:min(640px,calc(100% - 80px));transform-origin:50% 50%;transition:transform .45s cubic-bezier(.25,.8,.3,1),opacity .45s ease;cursor:pointer;backface-visibility:hidden}
.hrw-card.is-active{cursor:default}
.hrw-card .hr-msg-face{margin-bottom:28px}
.hrw-card.is-active .hr-bubble{box-shadow:0 6px 0 var(--line),0 18px 40px -16px rgba(15,23,42,.25)}
.hrw-card.is-active .hr-bubble.kind-morning{box-shadow:0 6px 0 var(--color-accent-color-3-light),0 18px 40px -16px rgba(15,23,42,.25)}
.hrw-card.is-active .hr-bubble.kind-reminder{box-shadow:0 6px 0 var(--brand-blue-line),0 18px 40px -16px rgba(15,23,42,.25)}
.hrw-card.is-active .hr-bubble.kind-shout-out{box-shadow:0 6px 0 var(--color-accent-color-6-light),0 18px 40px -16px rgba(15,23,42,.25)}
.hrw-card.is-active .hr-bubble p{font-size:21px}
.hrw-new{padding:2px 10px;border-radius:999px;background:var(--color-accent-color-4-lighter);color:var(--color-accent-color-4-darker);font-size:12px;font-weight:900}
.hrw-nav{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.hrw-nav button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--line)}
.hrw-nav button:hover:not(:disabled){border-color:var(--color-secondary-base);color:var(--color-secondary-darker)}
.hrw-nav button:disabled{opacity:.35;cursor:default}
.hrw-pips{display:flex;flex-direction:column;gap:5px;margin:4px 0}
.hrw-pips i{width:8px;height:8px;border-radius:99px;background:var(--prim-slate-300);transition:height .25s,background .25s}
.hrw-pips i.is-on{height:22px;background:var(--color-secondary-dark)}
.hrw-count{font-size:12px;font-weight:800;color:var(--muted)}
.hrw-hint{margin-top:6px;text-align:center;font-size:14px;color:var(--muted)}
@media (max-width:760px){.hrw-nav{position:static;transform:none;flex-direction:row;justify-content:center;margin-top:8px}.hrw-pips{flex-direction:row}.hrw-pips i.is-on{height:8px;width:22px}.hrw-card{width:calc(100% - 24px)}}
@media (prefers-reduced-motion:reduce){.hrw-card{transition:opacity .2s}}
.hrw-stage{height:560px}
.homeroom .hr-head{margin-bottom:4px;gap:2px}
.homeroom .hr-head-face{width:76px;height:76px}
.homeroom .hr-head .k5-h1{font-size:30px}

/* ===== K-5 Departments: sky + grass scene ===== */
.k5-scene{position:relative;overflow:hidden;border-radius:30px;padding:48px 28px 150px;background:linear-gradient(180deg,#B9D2F6 0%,#CFE0FA 55%,#DCEAFB 100%);border:3px solid #fff;box-shadow:0 10px 30px -14px rgba(30,64,175,.35)}
.k5-sky{position:absolute;inset:0;pointer-events:none}
.cloud{position:absolute;height:18px;border-radius:999px;background:rgba(255,255,255,.75)}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:45%;height:220%;left:18%;bottom:20%}
.cloud::after{width:32%;height:170%;right:14%;bottom:25%}
.k5-hill{position:absolute;left:-10%;right:-10%;bottom:-62%;height:110%;border-radius:50% 50% 0 0/22% 22% 0 0;background:linear-gradient(180deg,#D4EBA6 0%,#C2E08E 30%,#B5D77F 100%);box-shadow:inset 0 10px 0 #E2F2BE}
.tree{position:absolute;width:30px;height:40px;transform-origin:bottom center}
.tree path{fill:#8CC56B}.tree rect{fill:#7A5A3C}
.k5-jobs{position:relative;z-index:2;display:flex!important;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:nowrap;overflow-x:auto;padding:6px 6px 14px;grid-template-columns:none!important}
.k5-scene .k5-job{flex:0 0 220px;transform:translateY(var(--arc));box-shadow:0 7px 0 var(--j-base),0 16px 30px -14px rgba(15,23,42,.35)}
.k5-scene .k5-job:hover{transform:translateY(calc(var(--arc) - 4px)) rotate(-.4deg)}
.k5-scene .k5-job-help{font-size:14.5px}
.k5-scene .k5-job-name{font-size:20px}
.k5-ribbon{position:absolute;z-index:3;left:50%;bottom:34px;transform:translateX(-50%);filter:drop-shadow(0 4px 0 #1E3A8A)}
.k5-ribbon span{display:inline-block;padding:10px 46px;background:#3B5BDB;color:#fff;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.01em;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
@media (max-width:1200px){.k5-jobs{justify-content:flex-start}}
.k5-jobs{overflow:visible;justify-content:center!important;gap:14px}
.k5-scene .k5-job{flex:1 1 0;min-width:0;max-width:220px;padding:0 12px 18px}
.k5-scene .k5-job-art{margin:0 -12px;height:118px}
.k5-scene .k5-job-art svg{width:96px;height:96px}
.k5-scene .k5-job-prop{width:38px;height:38px;top:10px;right:10px}
.k5-scene .k5-job-name{font-size:18px}
.k5-scene .k5-job-help{font-size:13.5px}
.k5-scene .k5-job-ask{font-size:12px;padding:6px 10px}
.k5-scene .k5-job-ask strong{font-size:13.5px}
.k5-scene .k5-job-btn{min-height:42px;padding:8px 16px;font-size:15px}
.k5-scene .k5-job-ribbon{font-size:12.5px;padding:4px 12px}
@media (max-width:1050px){.k5-jobs{flex-wrap:wrap!important}.k5-scene .k5-job{flex:0 0 200px;transform:none}}
.k5-scene .k5-job-prop svg{width:20px!important;height:20px!important;margin:0}

/* ===== K-5 subject cards with art (YouTube Kids-style big tiles) ===== */
.k5-card.has-art{padding:0 0 22px;overflow:hidden;gap:14px}
.k5-card.has-art > :not(.k5-art){margin-left:22px;margin-right:22px}
.k5-art{position:relative;display:block;width:100%;height:170px;padding:0;border:0;background:var(--subject-soft);cursor:pointer;overflow:hidden}
.k5-art img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;transition:transform .4s ease}
.k5-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.18));pointer-events:none}
.k5-card.has-art:hover .k5-art img{transform:scale(1.05)}
.k5-art-play{position:absolute;left:50%;top:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s;z-index:1}
.k5-art-play svg{fill:var(--subject-ink);margin-left:4px}
.k5-card.has-art:hover .k5-art-play,.k5-art:focus-visible .k5-art-play{opacity:1;transform:scale(1)}
.k5-art-done{position:absolute;top:12px;right:12px;z-index:1;padding:5px 14px;border-radius:999px;background:#fff;color:var(--subject-ink);font-weight:900;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.k5-card.has-art .k5-card-top{margin-top:-46px;position:relative;z-index:1;align-items:flex-end}
.k5-card.has-art .k5-card-icon{width:84px;height:84px;border-radius:24px;border:4px solid var(--subject-soft);box-shadow:0 4px 0 var(--subject),0 8px 16px -6px rgba(0,0,0,.25)}
.k5-card.has-art .k5-card-h{font-size:28px;margin-bottom:2px}
.k5-card.has-art .k5-card-top .grow{padding-bottom:2px}
.k5-card.has-art .k5-card-top{align-items:flex-start;margin-top:-44px}
.k5-card.has-art .k5-card-top .grow{padding-top:50px}
.k5-art{height:190px}
/* K-5: pull the subject cards up — compact tabs + shorter path card */
.yk-tabs{gap:12px;margin:0}
.yk-tab{flex-direction:row;min-width:0;gap:12px;padding:8px 22px 8px 8px;border-radius:999px;box-shadow:0 4px 0 var(--prim-slate-200)}
.yk-icon{width:48px;height:48px;border-radius:50%}
.yk-icon svg{width:26px;height:26px}
.yk-label{font-size:18px}
.yk-tab.tab-classes.is-on{box-shadow:0 5px 0 var(--prim-admin-blue-400)}
.yk-tab.tab-calendar.is-on{box-shadow:0 5px 0 var(--color-accent-color-2-base)}
.k5-home{gap:16px}
.k5-quest{padding:16px 22px 4px}
.k5-quest .k5-h1{font-size:28px}
.k5-quest .k5-sub{font-size:15px;margin-top:2px}
.k5-quest .star-pill{padding:6px 14px}
.k5-quest .star-pill strong{font-size:20px}
.quest-map{margin-top:14px}
.quest-road,.quest-done{stroke-width:22}
@media (min-width:1200px){.k5-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.k5-art{height:160px}.k5-card.has-art .k5-card-h{font-size:24px}.k5-card.has-art .k5-card-icon{width:72px;height:72px}.k5-card.has-art .k5-card-top .grow{padding-top:44px}}
.quest-cap{font-family:var(--display);font-weight:900;font-size:14px;fill:var(--prim-slate-500)}
.k5-quest .quest-map{margin-bottom:6px}

/* ===== K-5 left menu: minimal line icons, label only on the active item ===== */
.k5-nav{gap:6px}
.k5-item,.side.is-min .k5-item{width:72px!important;padding:8px 4px!important;border:0!important;border-radius:16px;background:transparent!important;gap:4px;transform:none!important}
.k5-item:hover{background:var(--prim-slate-100)!important}
.k5-item .k5-icon,.side.is-min .k5-item .k5-icon{width:44px!important;height:44px!important;border-radius:0;background:transparent!important;box-shadow:none!important;color:var(--prim-slate-400)}
.k5-item .k5-icon svg{width:32px;height:32px;stroke-width:1.7}
.k5-item .k5-label,.side.is-min .k5-item .k5-label{display:none;font-family:var(--body);font-size:13px;font-weight:700;color:var(--prim-admin-blue-500)}
.k5-item.is-active .k5-icon{color:var(--prim-admin-blue-500)}
.k5-item.is-active .k5-label,.side.is-min .k5-item.is-active .k5-label{display:block}
.k5-item:focus-visible{outline:3px solid var(--prim-admin-blue-400);outline-offset:2px}
.side:has(.k5-nav) .k5-nav{align-items:center}
.side.is-min:has(.k5-nav){flex:0 0 96px;padding:18px 20px 18px 12px}
.side:not(.is-min):has(.k5-nav){flex:0 0 120px}
.k5-sound,.side.is-min .k5-sound{width:56px!important;padding:6px!important;border:0;background:transparent;box-shadow:none}
.k5-sound .k5-sound-icon{width:44px;height:44px;background:transparent!important;color:var(--prim-slate-400)}
.k5-sound.is-on .k5-sound-icon{color:var(--prim-admin-blue-500)}
.side .k5-sound .k5-sound-text,.side .k5-sound .k5-sound-track{display:none}
.side .k5-sound{flex-direction:column;align-self:center}
.side .k5-sound:hover{background:var(--prim-slate-100)}
.side .k5-item.is-active .k5-icon{color:var(--prim-admin-blue-500)!important}
/* K-5 My Calendar: more room under the class TV, day tiles as little calendar pages */
.k5-cal{gap:28px}
.k5-tv{margin-bottom:6px}
.k5-days{gap:14px;padding-top:8px}
.k5-dayb{position:relative;padding:0 0 12px;overflow:visible;gap:0;border-radius:18px;border:3px solid var(--prim-slate-200);box-shadow:0 5px 0 var(--prim-slate-200);background:#fff}
.k5-rings{position:absolute;top:-9px;left:0;right:0;display:flex;justify-content:space-between;padding:0 26%;z-index:2}
.k5-rings i{width:10px;height:18px;border-radius:6px;background:var(--prim-slate-600);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.k5-dayb-d{align-self:stretch;padding:9px 4px 7px;border-radius:14px 14px 0 0;background:var(--prim-admin-blue-500);color:#fff!important;font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:.01em}
.k5-dayb-n{font-size:40px;margin-top:6px;line-height:1}
.k5-dayb-m{font-size:13px;font-weight:800;color:var(--muted);margin-top:2px}
.k5-dayb .k5-dayb-today{margin-top:4px}
.k5-dayb-dots{margin-top:6px}
.k5-dayb.is-on{border-color:var(--color-accent-color-2-base);box-shadow:0 6px 0 var(--color-accent-color-2-base);background:var(--color-accent-color-2-subtle)}
.k5-dayb.is-on .k5-dayb-d{background:var(--color-accent-color-2-dark)}
.k5-dayb:hover:not(.is-on){transform:translateY(-2px)}
.k5-dayb{transition:transform .15s}
@media (max-width:760px){.k5-dayb-d{font-size:12px}.k5-dayb-n{font-size:28px}}

/* ===== Campus bulletin: right-side overlay drawer ===== */
.bd{position:fixed;top:76px;right:12px;bottom:12px;width:min(360px,calc(100vw - 24px));z-index:36;display:flex;flex-direction:column;border-radius:18px;background:var(--surface);border:1px solid var(--brand-blue-line);box-shadow:-10px 0 40px -10px rgba(15,23,42,.25);transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.3,1),visibility 0s linear .28s}
.bd.is-open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.3,1),visibility 0s}
.bd-head{display:flex;align-items:center;gap:12px;padding:16px 12px 14px 16px;border-bottom:1px solid var(--line);background:var(--brand-blue-soft);border-radius:18px 18px 0 0}
.bd-head-icon{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--brand-blue);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.bd-title{margin:0;font-family:var(--display);font-weight:800;font-size:17px}
.bd-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bd-post{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.bd-post:first-child{border-color:var(--brand-blue-line);background:linear-gradient(180deg,var(--brand-blue-soft),var(--surface))}
.bd-post-meta{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.bd-new{padding:1px 8px;border-radius:999px;background:var(--brand-blue);color:#fff;font-size:11px}
.bd-post-title{margin:6px 0 4px;font-size:15.5px;font-weight:800;line-height:1.3}
.bd-post-body{font-size:14px;color:var(--ink-2);line-height:1.5}
.bd-more{margin:0 16px 14px;align-self:flex-start}
.bd-tab{position:fixed;right:0;top:140px;z-index:35;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 14px 10px;border:1px solid var(--brand-blue-line);border-right:0;border-radius:14px 0 0 14px;background:var(--brand-blue-soft);color:var(--brand-blue-ink);box-shadow:-4px 4px 14px -6px rgba(15,23,42,.2);transition:transform .2s,opacity .2s}
.bd-tab:hover{transform:translateX(-3px);background:#fff}
.bd-tab.is-hidden{opacity:0;pointer-events:none;transform:translateX(100%)}
.bd-tab-icon{width:32px;height:32px;border-radius:10px;background:var(--brand-blue);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.bd-tab-n{min-width:20px;padding:0 6px;border-radius:999px;background:#C2410C;color:#fff;font-size:12px;font-weight:800;text-align:center}
.bd-tab-text{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.bd,.bd.is-open,.bd-tab{transition:none}}
.bd-tab{top:auto;bottom:calc(50% - 60px)}

/* ===== Chunking: timeline and learning queue as distinct sections ===== */
.lth-card{margin-bottom:22px;box-shadow:0 2px 10px rgba(15,23,42,.05)}
.lq{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 20px 10px;box-shadow:0 2px 10px rgba(15,23,42,.05);gap:14px}
.lq-head{padding:0 2px}
.lq-list{margin-top:4px;padding:18px 2px 4px;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}

/* ===== Live today: plan vs all times, optional + conflict states ===== */
.lth-side{gap:6px}
.lth-mode{display:flex;gap:2px;margin-top:6px;padding:2px;border-radius:999px;background:rgba(255,255,255,.1)}
.lth-mode button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:26px;padding:2px 8px;border:0;border-radius:999px;background:transparent;color:#CBD5E1;font-size:11.5px;font-weight:800;white-space:nowrap}
.lth-mode button.is-on{background:#fff;color:#0F172A}
.lth-mode-n{padding:0 5px;border-radius:999px;background:#3B82F6;color:#fff;font-size:10px}
.lth-mode button.is-on .lth-mode-n{background:#DBEAFE;color:#1E3A8A}
.lth-track{transition:height .25s ease}
.pill.is-option{background:#fff;border:2px dashed var(--p-base);box-shadow:none}
.pill.is-option .pill-badge{box-shadow:none;border:2px solid var(--p-soft)}
.pill.is-option .pill-meta{font-weight:700}
.pill-add{background:var(--p-soft)!important;color:var(--p-ink)!important;box-shadow:none!important}
.pill-add:hover{background:var(--p-ink)!important;color:#fff!important}
.pill.is-clash{outline:2px solid #DE5D46;outline-offset:1px}
.pill.is-clash .pill-meta{color:#A3261B;opacity:1}
.pill-x{position:relative;flex-shrink:0;width:24px;height:24px;border:0;border-radius:50%;background:rgba(255,255,255,.7);color:var(--p-ink);display:inline-flex;align-items:center;justify-content:center}
.pill-x:hover{background:#fff}
.pill.is-option.is-ended{opacity:.35}
/* equal rhythm: greeting -> Live today -> learning queue */
.greet{margin-bottom:12px}
.lth-card{margin-bottom:12px!important}
.bulletin,.ann-min{margin-bottom:12px}
.lq-head-r{display:flex;align-items:center;gap:10px}
.lq-courses{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13.5px;font-weight:700}
.lq-courses:hover{background:var(--hover);color:var(--ink)}

/* ===== Student services ===== */
.nav-fly{width:280px}
.nav-fly-item{align-items:flex-start}

.ss-h{margin:0 0 12px;font-family:var(--display);font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px}
.ss-count{padding:1px 9px;border-radius:999px;background:var(--prim-slate-100);font-size:13px;color:var(--ink-2)}

.ss-person{display:flex;gap:16px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(15,23,42,.05)}
.ss-av{width:60px;height:60px;flex-shrink:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#fff}
.ss-person.is-advisor .ss-av{background:var(--prim-admin-blue-500)}
.ss-person.is-counselor .ss-av{background:var(--color-secondary-dark,#0CA3A1)}
.ss-role{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--prim-admin-blue-700)}
.ss-person.is-counselor .ss-role{color:var(--color-secondary-darker)}
.ss-name{margin:2px 0 4px;font-family:var(--display);font-weight:800;font-size:20px}
.ss-help{font-size:14.5px;color:var(--ink-2);max-width:52ch}
.ss-hours{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:700;color:var(--muted)}
.ss-teachers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ss-teacher{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.ss-teacher-top{display:flex;align-items:center;gap:12px}
.ss-t-av{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:var(--subject-soft);color:var(--subject-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--subject-soft)}
.ss-t-name{margin:0;font-size:16px;font-weight:800}
.ss-t-course{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.ss-t-dot{width:8px;height:8px;border-radius:50%;background:var(--subject)}
.ss-depts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.ss-depts{grid-template-columns:minmax(0,1fr)}}
.ss-dept{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--ink);box-shadow:0 2px 10px rgba(15,23,42,.05);transition:box-shadow .15s,transform .15s}
.ss-dept:hover{box-shadow:0 8px 24px -8px rgba(15,23,42,.18);transform:translateY(-1px)}
.ss-dept-icon{width:52px;height:52px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:6px}
.ss-dept.is-admin .ss-dept-icon{background:var(--brand-blue-soft);color:var(--prim-admin-blue-700)}
.ss-dept.is-counseling .ss-dept-icon{background:var(--color-accent-color-6-subtle);color:var(--color-accent-color-6-darker)}
.ss-dept.is-registrar .ss-dept-icon{background:var(--color-accent-color-3-subtle);color:var(--color-accent-color-3-darker)}
.ss-dept.is-testing .ss-dept-icon{background:var(--color-accent-color-4-subtle);color:var(--color-accent-color-4-darker)}
.ss-dept-name{font-family:var(--display);font-weight:800;font-size:20px}
.ss-dept-desc{font-size:14.5px;color:var(--ink-2)}
.ss-dept-lead{font-size:13px;font-weight:700;color:var(--muted)}
.ss-dept-go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;color:var(--link)}
/* K-5 My team: rainbow + sunshine banner */
.k5-rainbow{position:relative;display:flex;align-items:center;gap:18px;margin:-6px 0 18px;padding:14px 24px 14px 14px;border-radius:26px;overflow:hidden;background:linear-gradient(100deg,#FFF6E0 0%,#FDEDF3 35%,#EAF2FF 70%,#E6FAF2 100%);border:3px solid #fff;box-shadow:0 6px 0 #F3E3F1,0 14px 30px -16px rgba(169,118,206,.45)}
.k5-rb-art{width:170px;height:92px;flex-shrink:0}
.k5-rb-text{flex:1;min-width:0}
.k5-rb-h{font-family:var(--display);font-weight:900;font-size:24px;line-height:1.15;color:#5B2A86}
.k5-rb-text p{margin-top:4px;font-size:16.5px;line-height:1.45;color:var(--ink-2);max-width:60ch}
.k5-rb-sun{width:92px;height:92px;flex-shrink:0;animation:sunspin 24s linear infinite}
@keyframes sunspin{to{transform:rotate(360deg)}}
@media (max-width:760px){.k5-rb-art{display:none}.k5-rb-sun{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){.k5-rb-sun{animation:none}}
/* K-5 slim "Up next" bar under the path map */
.k5-upnext{display:flex;align-items:center;gap:14px;margin:4px 0 12px;padding:10px 10px 10px 12px;border-radius:999px;background:var(--subject-soft);border:2px solid var(--subject)}
.k5-upnext-tag{flex-shrink:0;padding:4px 12px;border-radius:999px;background:var(--subject-ink);color:#fff;font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.02em}
.k5-upnext-icon{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:#fff;color:var(--subject-ink);display:inline-flex;align-items:center;justify-content:center}
.k5-upnext-title{font-family:var(--display);font-weight:900;font-size:18px;line-height:1.2;color:var(--ink)}
.k5-upnext-sub{font-size:13.5px;font-weight:700;color:var(--subject-ink)}
.k5-upnext-go{flex-shrink:0;min-height:44px;padding:8px 22px;border-radius:999px;background:var(--subject-ink);color:#fff;font-weight:900;font-size:16px;box-shadow:0 3px 0 color-mix(in srgb,var(--subject-ink) 55%,#000)}
.k5-upnext-go svg{fill:currentColor}
.k5-upnext-go:hover{filter:brightness(1.2)}
@media (max-width:640px){.k5-upnext{border-radius:20px;flex-wrap:wrap}}

/* ===== 6-12 school team: Animal Crossing-style charm ===== */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shadowbob{0%,100%{transform:translateX(-50%) scale(1);opacity:.22}50%{transform:translateX(-50%) scale(.85);opacity:.14}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.ac-portrait{position:relative;flex-shrink:0;width:104px;height:116px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.ac-portrait.lg{width:120px;height:132px}
.ac-face{position:relative;z-index:1;width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 0 0 5px var(--ring),0 8px 18px -8px rgba(15,23,42,.35);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;animation:bob 3.2s ease-in-out infinite;animation-delay:var(--bob-delay,0s)}
.ac-portrait.lg .ac-face{width:108px;height:108px}
.ac-face svg{margin-bottom:-4px}
.ac-shadow{position:absolute;left:50%;bottom:2px;width:64px;height:10px;border-radius:50%;background:#0F172A;animation:shadowbob 3.2s ease-in-out infinite;animation-delay:var(--bob-delay,0s)}
.ac-portrait:hover .ac-face,.ac-portrait:focus-visible .ac-face{animation:wiggle .5s ease-in-out}
.ac-portrait:focus-visible{outline:none}
.ac-portrait:focus-visible .ac-face{box-shadow:0 0 0 5px var(--ring),0 0 0 9px var(--prim-admin-blue-300)}
.ac-bubble{position:absolute;z-index:5;bottom:calc(100% - 4px);left:50%;width:210px;padding:10px 14px;border-radius:18px;background:#FFFBF0;border:2px solid #E8DCC0;color:#4A3B22;font-size:13px;font-weight:700;line-height:1.35;text-align:center;box-shadow:0 6px 16px -8px rgba(74,59,34,.4);opacity:0;transform:translate(-50%,8px) scale(.9);transform-origin:bottom center;transition:opacity .18s,transform .18s;pointer-events:none}
.ac-bubble::after{content:"";position:absolute;left:50%;top:100%;width:14px;height:14px;background:#FFFBF0;border-right:2px solid #E8DCC0;border-bottom:2px solid #E8DCC0;transform:translate(-50%,-7px) rotate(45deg)}
.ac-portrait:hover .ac-bubble,.ac-portrait:focus-visible .ac-bubble{opacity:1;transform:translate(-50%,0) scale(1)}
.ss-person{align-items:center;overflow:visible}
.ss-person .ss-av{display:none}
/* teachers on a little field */
.ac-field{position:relative;padding:18px 20px 22px;border-radius:24px;background:linear-gradient(180deg,#DCEBFB 0%,#EAF4FF 46%,#E9F6DA 46%,#DDF0C6 100%);border:2px solid #fff;box-shadow:0 2px 10px rgba(15,23,42,.05);overflow:visible}
.ac-field .ss-h{position:relative;z-index:2}
.ac-sky{position:absolute;inset:0 0 auto 0;height:120px;pointer-events:none;overflow:hidden;border-radius:24px 24px 0 0}
.ac-sky .cloud{background:rgba(255,255,255,.85)}
.ac-grass{display:none}
.ac-villagers{position:relative;z-index:2;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))!important;gap:18px!important;padding-top:56px}
.ac-villager{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 10px 14px;border-radius:22px;background:rgba(255,255,255,.72);border:2px solid #fff;box-shadow:0 6px 0 rgba(15,23,42,.06);text-align:center;margin-top:-40px;overflow:visible}
.ac-villager:nth-child(even){margin-top:-24px}
.ac-villager .ac-portrait{margin-top:-46px}
.ac-nametag{margin-top:2px;padding:4px 16px 5px;border-radius:999px 999px 999px 999px;background:var(--subject-ink);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--subject-ink) 55%,#000)}
.ac-name{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.01em}
.ac-villager .ss-t-course{justify-content:center}
.ac-actions{justify-content:center;margin-top:4px}
@media (prefers-reduced-motion:reduce){.ac-face,.ac-shadow{animation:none}.ac-portrait:hover .ac-face{animation:none}}
.ac-villagers{row-gap:64px!important;padding-top:64px}
.ac-villager{margin-top:0!important}
.ac-villager:nth-child(even){transform:translateY(14px)}
.ac-field{padding-bottom:36px}

/* K-5 Up next: floating white card, calmer color */
.k5-upnext{margin:22px 4px 14px;padding:12px 12px 12px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--subject);box-shadow:0 14px 30px -14px rgba(15,23,42,.28),0 2px 6px rgba(15,23,42,.05);animation:upfloat 4s ease-in-out infinite}
@keyframes upfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.k5-upnext-tag{background:var(--brand-blue-soft);color:var(--prim-admin-blue-800)}
.k5-upnext-icon{background:var(--subject-soft);color:var(--subject-ink)}
.k5-upnext-sub{color:var(--muted)}
.k5-upnext-go{background:var(--accent)!important;color:#fff;box-shadow:0 4px 0 var(--color-primary-darker)}
.k5-upnext-go:hover{filter:none;background:var(--accent-hover)!important}
@media (prefers-reduced-motion:reduce){.k5-upnext{animation:none}}

/* ===== 6-12 Departments: rooms of a little school building ===== */
.bldg{max-width:980px;margin:6px auto 0;filter:drop-shadow(0 18px 24px rgba(15,23,42,.12))}
.bldg-roof{position:relative;height:84px;margin:0 -18px;background:#C8553D;clip-path:polygon(4% 100%,50% 0,96% 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
.bldg-sign{padding:4px 16px;border-radius:8px;background:#FFF6E0;color:#7A2E1F;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.04em}
.bldg-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:14px;background:#F2E6D6;border-left:10px solid #E4D3BC;border-right:10px solid #E4D3BC}
@media (max-width:760px){.bldg-body{grid-template-columns:minmax(0,1fr)}}
.room{display:flex;flex-direction:column;padding:0;border:4px solid #fff;border-radius:16px;overflow:hidden;background:#fff;text-align:left;cursor:pointer;transition:transform .18s,box-shadow .18s;box-shadow:inset 0 0 0 1px #E4D3BC}
.room:hover,.room:focus-visible{transform:translateY(-4px) scale(1.01);box-shadow:0 14px 24px -12px rgba(15,23,42,.35);outline:none}
.room:focus-visible{border-color:var(--prim-admin-blue-400)}
.room-scene{position:relative;height:150px;overflow:hidden}
.room.is-admin .room-scene{background:repeating-linear-gradient(90deg,#DCE8FA 0 18px,#E7EFFC 18px 36px)}
.room.is-counseling .room-scene{background:radial-gradient(circle at 20% 30%,#FCE6EC 0 6px,transparent 7px) 0 0/34px 34px,#FFF1F4}
.room.is-registrar .room-scene{background:repeating-linear-gradient(0deg,#FFF0CF 0 16px,#FFF6E0 16px 32px)}
.room.is-testing .room-scene{background:#E3F6EC}
.room-floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(90deg,#C99A6B 0 40px,#BC8C5E 40px 42px)}
.room-window{position:absolute;top:16px;right:20px;width:62px;height:54px;border-radius:8px;background:linear-gradient(180deg,#BFE3FF,#E7F5FF);border:4px solid #fff;box-shadow:0 0 0 2px #E4D3BC;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.room-window i{background:transparent;border-right:3px solid #fff}
.prop{position:absolute;bottom:30px;display:block}
.desk{left:24px;width:110px;height:40px;background:#8C5A3C;border-radius:6px 6px 0 0;box-shadow:inset 0 8px 0 #A06A47}
.desk::before{content:"";position:absolute;left:38px;top:-26px;width:34px;height:24px;background:#334155;border-radius:4px;box-shadow:inset 0 0 0 3px #475569}
.frame{left:150px;bottom:auto;top:22px;width:40px;height:40px;border-radius:6px;background:#fff;border:4px solid #C8553D;color:#E59700;font-size:18px;display:flex;align-items:center;justify-content:center}
.plant{left:150px;width:22px;height:26px;background:#C8553D;border-radius:0 0 6px 6px}
.plant::before{content:"";position:absolute;left:-10px;top:-30px;width:42px;height:34px;border-radius:50% 50% 40% 40%;background:#65B57F}
.couch{left:22px;width:130px;height:44px;background:#E58A90;border-radius:14px 14px 6px 6px;box-shadow:inset 0 -14px 0 #D4737A}
.couch::before{content:"";position:absolute;left:14px;top:-8px;width:28px;height:22px;border-radius:8px;background:#FFD6DA}
.lamp{left:168px;width:6px;height:70px;background:#64748B}
.lamp::before{content:"";position:absolute;left:-16px;top:-6px;width:38px;height:24px;background:#FFD25E;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}
.rug{left:10px;bottom:6px;width:180px;height:16px;border-radius:50%;background:#B9A3E3;opacity:.8}
.cabinet{left:24px;width:58px;height:90px;background:#7A8BA3;border-radius:6px;display:flex;flex-direction:column;gap:4px;padding:6px}
.cabinet i{flex:1;border-radius:3px;background:#94A3B8;position:relative}
.cabinet i::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:4px;margin:-2px 0 0 -7px;border-radius:2px;background:#E2E8F0}
.papers{left:100px;width:60px;height:26px;background:#fff;border-radius:3px;box-shadow:4px -6px 0 #F8FAFC,8px -12px 0 #fff,0 0 0 1px #E2E8F0}
.clock{left:110px;bottom:auto;top:20px;width:40px;height:40px;border-radius:50%;background:#fff;border:4px solid #E59700}
.clock::before{content:"";position:absolute;left:50%;top:6px;width:3px;height:14px;background:#334155;margin-left:-1.5px}
.clock::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:3px;background:#334155}
.board{left:20px;bottom:auto;top:18px;width:120px;height:60px;border-radius:6px;background:#2F5D4A;border:5px solid #A06A47;color:#fff;font-family:var(--display);font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center}
.desks{left:16px;display:flex;gap:16px}
.desks i{width:46px;height:26px;background:#A06A47;border-radius:4px 4px 0 0;box-shadow:inset 0 6px 0 #B57D57}
.room-label{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;color:var(--ink)}
.room-icon{width:34px;height:34px;flex-shrink:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.room.is-admin .room-icon{background:var(--brand-blue-soft);color:var(--prim-admin-blue-700)}
.room.is-counseling .room-icon{background:var(--color-accent-color-6-subtle);color:var(--color-accent-color-6-darker)}
.room.is-registrar .room-icon{background:var(--color-accent-color-3-subtle);color:var(--color-accent-color-3-darker)}
.room.is-testing .room-icon{background:var(--color-accent-color-4-subtle);color:var(--color-accent-color-4-darker)}
.room-name{display:block;font-family:var(--display);font-weight:800;font-size:17px}
.room-lead{display:block;font-size:12.5px;color:var(--muted)}
.room-go{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:13px;color:var(--link)}
.bldg-base{position:relative;height:46px;margin:0 -10px;background:#D9C4A6;border-radius:0 0 10px 10px;display:flex;justify-content:center}
.bldg-door{position:absolute;bottom:14px;width:60px;height:56px;border-radius:30px 30px 0 0;background:#8C5A3C;box-shadow:inset 0 0 0 4px #A06A47}
.bldg-steps{position:absolute;bottom:0;width:120px;height:14px;background:#C9B08C;border-radius:4px 4px 0 0}

/* ===== Bulletin "peekaboo" bottom sheet ===== */
.bp-scrim{position:fixed;inset:0;z-index:44;background:rgba(15,23,42,.28);backdrop-filter:blur(2px);animation:fadein .25s ease-out}
.bp{position:fixed;left:50%;bottom:0;z-index:45;width:min(760px,calc(100vw - 24px));height:min(74vh,720px);display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#EEF4FF,#F8FAFF 40%,#fff);border:1px solid var(--brand-blue-line);border-bottom:0;box-shadow:0 -14px 40px -16px rgba(30,58,138,.35);transform:translate(-50%,calc(100% - 78px));transition:transform .5s cubic-bezier(.2,.9,.25,1.12)}
.bp.is-open{transform:translate(-50%,0)}
.bp-peek{position:relative;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:8px 20px 10px;border:0;background:transparent;border-radius:28px 28px 0 0;overflow:hidden;cursor:pointer;color:var(--ink)}
.bp-peek:hover .bp-handle{width:56px;background:var(--prim-admin-blue-400)}
.bp-handle{width:44px;height:5px;border-radius:99px;background:var(--prim-slate-300);transition:width .2s,background .2s}
.bp-peek-row{display:flex;align-items:center;gap:10px}
.bp-peek-icon{width:30px;height:30px;border-radius:9px;background:var(--brand-blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;animation:wigglebell 7s ease-in-out infinite}
@keyframes wigglebell{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-14deg)}94%{transform:rotate(12deg)}97%{transform:rotate(-6deg)}}
.bp-peek-title{font-family:var(--display);font-weight:900;font-size:16px}
.bp-peek-n{padding:1px 9px;border-radius:999px;background:#C2410C;color:#fff;font-size:12px;font-weight:800}
.bp-chev{display:inline-flex;color:var(--prim-admin-blue-700);transition:transform .3s}
.bp-chev.is-open{transform:rotate(180deg)}
.bp-peek-teaser{font-size:13px;color:var(--muted);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bp-peek::after{content:"";position:absolute;top:0;left:-40%;width:30%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.9),transparent);transform:skewX(-18deg);opacity:0;pointer-events:none}
.bp-peek.is-shine::after{animation:shine 1.2s ease-out .15s}
@keyframes shine{0%{left:-40%;opacity:1}100%{left:120%;opacity:1}}
.bp-body{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:0 22px 28px;scrollbar-width:thin}
.bp-par{position:sticky;top:0;height:0;z-index:0;pointer-events:none}
.bp-layer{position:absolute;left:0;right:0;top:0;height:1400px;will-change:transform}
.bp-layer i{position:absolute;border-radius:50%}
.l1 i{width:8px;height:8px;background:#C7D8F8}
.l2 i{width:14px;height:14px;background:#FCD9C9;opacity:.8}
.l3 i{width:24px;height:24px;background:#D7F0E3;opacity:.9;border-radius:8px;transform:rotate(20deg)}
.bp-intro{position:relative;z-index:1;padding:14px 4px 6px;will-change:transform}
.bp-intro-k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--prim-admin-blue-700)}
.bp-intro-h{margin:2px 0 0;font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:-.01em}
.bp-stack{position:relative;z-index:1;display:flex;flex-direction:column;gap:14px;padding-top:8px}
.bp-card{position:sticky;display:flex;gap:14px;padding:16px 18px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px -14px rgba(15,23,42,.3)}
.bp-card.is-fresh{border:2px solid var(--brand-blue-line);background:linear-gradient(180deg,#F4F8FF,#fff)}
.bp-card-icon{width:46px;height:46px;flex-shrink:0;border-radius:14px;background:var(--c-soft);color:var(--c-ink);display:inline-flex;align-items:center;justify-content:center}

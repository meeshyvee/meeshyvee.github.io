.gate .lede{max-width:60ch;font-size:16px}
.gate-steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.gate-step{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:14px;color:var(--muted)}
.gate-step span{width:26px;height:26px;border-radius:50%;background:var(--prim-slate-200);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.gate-step.is-now{border-color:var(--color-primary-base);background:var(--color-primary-subtle);color:var(--color-primary-darker)}
.gate-step.is-now span{background:var(--color-primary-dark);color:#fff}
.gate-arrow{color:var(--muted);display:inline-flex}
.lq-row-play.is-locked svg{fill:none!important;margin-left:0}
/* connect the pull tab to the bulletin panel */
.bl-panel{margin:0;background:linear-gradient(180deg,#EEF4FF,#F6F9FF)}
.bl-pull{right:28px;bottom:-37px;background:#F6F9FF;border-color:var(--brand-blue-line);border-top:0;box-shadow:0 10px 16px -12px rgba(30,58,138,.35)}
.bl-wrap.is-closed .bl-pull{bottom:-37px;background:linear-gradient(180deg,#EEF4FF,#F6F9FF)}
.bl-pull::before{content:"";position:absolute;left:0;right:0;top:-2px;height:3px;background:#F6F9FF}
.bl-wrap.is-closed .bl-pull::before{background:#EEF4FF}
.bl-wrap:not(.is-closed) + .greet{margin-top:22px}
/* learning queue: Spotify-style scroll after ~15 rows */
.lq-rows.is-scroll{max-height:calc(15 * 58px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--prim-slate-300) transparent;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 40px),transparent);padding-bottom:30px}
.lq-rows.is-scroll:focus-visible{outline:2px solid var(--prim-admin-blue-300);outline-offset:4px;border-radius:12px}
.lq-row-due.due-later{color:var(--muted)}
/* My Courses: one unified tile color instead of per-subject colors */
.side .launcher .grade-tile{background:var(--brand-blue-soft)!important;color:var(--prim-admin-blue-900)!important;box-shadow:inset 0 0 0 1px var(--brand-blue-line)}
.side .launcher:hover{background:var(--prim-slate-50)!important;border-color:var(--line)!important}
.side .launcher-hbar span{background:var(--prim-admin-blue-500)}
.side .launcher:hover .lp-ring,.side .launcher:focus-visible .lp-ring{fill:var(--prim-admin-blue-600);stroke:var(--prim-admin-blue-600)}

/* ===== Study playlists + combined filters ===== */
.lq-list-head{align-items:flex-start}
.lq-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.lq-clear{margin-left:10px;font-size:13px;padding:0}
.pl-dd{position:relative;display:inline-flex;align-items:center}
.pl-trigger{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:6px 12px;border-radius:var(--r-tag);border:1px dashed var(--line-2);background:var(--surface);color:var(--ink-2);font-size:14px;font-weight:700}
.pl-trigger:hover{background:var(--hover)}
.pl-trigger.is-set{border-style:solid;padding-right:34px}
.pl-trigger.tone-coral{background:var(--color-accent-color-2-subtle);border-color:var(--color-accent-color-2-light);color:var(--color-accent-color-2-darker)}
.pl-trigger.tone-yellow{background:var(--color-accent-color-3-subtle);border-color:var(--color-accent-color-3-light);color:var(--color-accent-color-3-darker)}
.pl-trigger.tone-purple{background:var(--color-primary-subtle);border-color:var(--color-primary-light);color:var(--color-primary-darker)}
.pl-trigger.tone-teal{background:var(--color-secondary-subtle);border-color:var(--color-secondary-light);color:var(--color-secondary-darker)}
.pl-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;border-radius:50%;background:rgba(255,255,255,.8);color:inherit;display:inline-flex;align-items:center;justify-content:center}
.pl-x:hover{background:#fff}
.pl-backdrop{position:fixed;inset:0;z-index:30}
.pl-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:31;width:320px;padding:8px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px -16px rgba(15,23,42,.3);animation:fadein .15s ease-out}
.pl-menu-h{padding:6px 10px 8px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:10px;background:transparent;text-align:left;color:var(--ink)}
.pl-item:hover,.pl-item:focus-visible{background:var(--hover);outline:none}
.pl-item.is-on{background:var(--prim-slate-100)}
.pl-item-ic{width:32px;height:32px;flex-shrink:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.pl-item.tone-slate .pl-item-ic{background:var(--prim-slate-100);color:var(--prim-slate-700)}
.pl-item.tone-coral .pl-item-ic{background:var(--color-accent-color-2-subtle);color:var(--color-accent-color-2-darker)}
.pl-item.tone-yellow .pl-item-ic{background:var(--color-accent-color-3-subtle);color:var(--color-accent-color-3-darker)}
.pl-item.tone-purple .pl-item-ic{background:var(--color-primary-subtle);color:var(--color-primary-darker)}
.pl-item.tone-teal .pl-item-ic{background:var(--color-secondary-subtle);color:var(--color-secondary-darker)}
.pl-item .grow{display:flex;flex-direction:column}
.pl-item-name{font-weight:800;font-size:14.5px}
.pl-item-desc{font-size:12.5px;color:var(--muted)}
.pl-item-n{min-width:24px;padding:1px 7px;border-radius:99px;background:var(--prim-slate-100);font-size:12px;font-weight:800;text-align:center;color:var(--ink-2)}
.pl-menu-note{margin:6px 4px 2px;padding:8px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.lq-up-pl{margin-left:8px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.75);font-size:11px;letter-spacing:.02em;text-transform:none;font-weight:700}
.lq-nav:disabled,.lq-shuffle:disabled{opacity:.35;cursor:default}
.lq-next-step .lq-title{font-size:20px}
.lq-row{position:relative}
.lk-pop{position:absolute;z-index:20;left:90px;top:calc(100% - 4px);width:330px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--color-primary-light);box-shadow:0 16px 34px -14px rgba(15,23,42,.35);animation:fadein .15s ease-out}
.lk-pop-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:16px}
.lk-pop-ic{width:26px;height:26px;border-radius:8px;background:var(--color-primary-subtle);color:var(--color-primary-darker);display:inline-flex;align-items:center;justify-content:center}
.lk-pop p{margin:6px 0 10px;font-size:14px;color:var(--ink-2)}
.lq-rows.is-scroll{overflow-x:visible}
.lq-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 12px;text-align:center}
.lq-empty-h{font-family:var(--display);font-weight:900;font-size:20px}
.lq-empty p{color:var(--muted)}
.lq-row.is-locked .lq-row-play{cursor:pointer}
/* My Courses: names styled like Campus links; grade tiles share a fill, outline in course color */
.side .launcher-name{font-family:var(--body);font-size:15px;font-weight:500;color:var(--ink-2)}
.side .launcher:hover .launcher-name{color:var(--ink)}
.side .launcher .grade-tile{background:#fff!important;color:var(--subject-ink)!important;box-shadow:inset 0 0 0 2px var(--subject),0 2px 0 var(--subject-soft);font-weight:900}
.side .launcher:hover .grade-tile{background:var(--subject-soft)!important}
.side .launcher-hbar span{background:var(--subject)}
/* Coming up: title + playlists on one row, date filters below */
.lq-list-head{flex-direction:column;align-items:stretch;gap:12px}
.lq-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lq-filters{justify-content:flex-start}
/* My Courses hover: tile stays put; the course outline wraps the whole row */
.side .launcher{border:1px solid transparent!important;padding:7px 9px;align-items:center}
.side .launcher .grade-tile{align-self:center;height:40px;min-height:0}
.side .launcher:hover,.side .launcher:focus-visible{background:color-mix(in srgb,var(--subject-soft) 45%,#fff)!important;border-color:var(--subject)!important;box-shadow:0 3px 0 var(--subject-soft)}
.side .launcher:hover .grade-tile,.side .launcher:focus-visible .grade-tile{background:#fff!important}
.side .launcher:hover .lp-ring,.side .launcher:focus-visible .lp-ring{fill:var(--subject-ink);stroke:var(--subject-ink)}
/* row action reads as "Open" (navigate), not media "play" */
.lq-row-open{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;min-width:84px;min-height:34px;margin-right:6px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:700;transition:background .15s,color .15s,border-color .15s}
.lq-row-open:hover,.lq-row-open:focus-visible{background:var(--prim-slate-800);border-color:var(--prim-slate-800);color:#fff}
.lq-row-open svg{transition:transform .15s}
.lq-row-open:hover svg{transform:translateX(2px)}
.lq-row-open.is-locked{border-style:dashed;color:var(--muted);background:transparent}
.lq-row-open.is-locked:hover,.lq-row-open.is-locked:focus-visible{background:var(--color-primary-subtle);border-color:var(--color-primary-light);color:var(--color-primary-darker)}
/* Live sessions panel: light, blends with the page */
.lth-side{background:var(--surface-2)!important;border-right:1px solid var(--line)!important}
.lth-label{color:var(--ink)!important}
.lth-label .live-dot{color:#DE5D46;box-shadow:0 0 0 3px rgba(222,93,70,.18)}
.lth-cal{color:var(--link)!important}
.lth-cal:hover{color:var(--link-hover)!important}
.lth-mode{background:var(--prim-slate-100)}
.lth-mode button{color:var(--ink-2)}
.lth-mode button.is-on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
/* featured card: "Start" pill instead of a media play button */
.lq-start{display:inline-flex;align-items:center;gap:8px;min-height:56px;padding:12px 26px 12px 28px;border:0;border-radius:999px;background:var(--lq-ink);color:#fff;font-family:var(--display);font-weight:800;font-size:18px;box-shadow:0 10px 20px -8px color-mix(in srgb,var(--lq-ink) 70%,transparent);transition:transform .15s,filter .15s}
.lq-start svg{fill:currentColor}
.lq-start:hover{transform:translateY(-1px);filter:brightness(1.15)}
.lq-start:focus-visible{outline:3px solid var(--lq-ink);outline-offset:3px}
/* One combined container: Live sessions (top band) + Learning queue (body) */
.lth-card{margin-bottom:0!important;border-radius:24px 24px 0 0!important;box-shadow:none!important;border:1px solid var(--line)!important;border-bottom:0!important;background:var(--surface-2)}
.lth-card .lth-side{background:transparent!important}
.lth-card .lth-scroll{background:transparent}
.lth-card + .lq{margin-top:-20px;border-radius:0 0 24px 24px;border-top:1px solid var(--line);box-shadow:0 2px 10px rgba(15,23,42,.05)}
.lth-card:has(+ .lq){box-shadow:0 -1px 10px rgba(15,23,42,.04)!important}
.lth-card + .lq .lq-head{padding-top:4px}
/* grade tiles: no hard drop shadow */
.side .launcher .grade-tile{box-shadow:inset 0 0 0 2px var(--subject)!important}
.side .launcher:hover,.side .launcher:focus-visible{box-shadow:none}
/* Featured card: book-style offset artwork that breaks out of the card */
.lq-card{position:relative;margin:28px 0 4px 26px;padding:22px 22px 18px 196px;overflow:visible}
.lq-main{position:static}
.lq-art{position:absolute;left:-26px;top:-28px;width:190px;height:210px;border-radius:18px;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.55),transparent 55%),var(--lq-art)!important;color:var(--lq-ink);box-shadow:0 18px 30px -14px rgba(15,23,42,.45),0 0 0 4px #fff!important;transform:rotate(-2deg);transition:transform .25s ease}
.lq-art svg{width:64px;height:64px}
.lq-art::after{content:"";position:absolute;left:14px;right:14px;bottom:16px;height:6px;border-radius:99px;background:color-mix(in srgb,var(--lq-ink) 25%,transparent)}
.lq-card:hover .lq-art{transform:rotate(0deg) translateY(-2px)}
.lq-main.is-out .lq-art,.lq-main.is-in .lq-art{transition:none}
.lq-foot{padding-left:0}
.lq-next-step{padding-left:196px}
@media (max-width:760px){.lq-card{margin-left:0;margin-top:16px;padding-left:22px}.lq-art{position:relative;left:0;top:0;width:96px;height:110px;transform:none}}
@media (prefers-reduced-motion:reduce){.lq-art{transition:none}}
/* flat offset art (no tilt, no drop shadow) */
.lq-art{transform:none!important;box-shadow:0 0 0 4px #fff!important;transition:none}
.lq-card:hover .lq-art{transform:none!important}
/* controls live below the card */
.lq-card{padding-bottom:22px;min-height:170px}
.lq-foot-out{margin:4px 2px 2px;padding:0}
.lq-foot-out .lq-foot-l{color:var(--ink-2)}
.lq-foot-out .lq-foot-l svg{color:var(--muted)}
.lq-foot-out .lq-nav{color:var(--ink-2)}
.lq-foot-out .lq-shuffle{background:#fff;color:var(--ink-2);border:1px solid var(--line-2)!important;box-shadow:none}
.lq-foot-out .lq-shuffle:hover{background:var(--hover)}
.lq-foot-out .lq-start{background:var(--prim-slate-800);box-shadow:none}

/* ===== Simpler featured card (light version of the reference layout) ===== */
.lq-hero{position:relative;display:flex;align-items:stretch;gap:16px;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(15,23,42,.04)}
.lq-hero-main{display:flex;align-items:stretch;gap:22px;flex:1;min-width:0}
.lq-hero-art{flex:0 0 150px;min-height:180px;border-radius:16px;background:var(--lq-art);color:var(--lq-ink);display:flex;align-items:center;justify-content:center}
.lq-hero-info{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:4px 0;min-width:0}
.lq-hero-k{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lq-ink)}
.lq-hero-title{margin:2px 0 0;font-family:var(--body);font-weight:700;font-size:clamp(22px,2.2vw,28px);line-height:1.2;color:var(--ink)}
.lq-hero-sub{font-size:16px;color:var(--ink-2)}
.lq-hero-due{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600}
.lq-hero-due .due-pastdue{color:var(--alert-error-dark)}.lq-hero-due .due-today{color:var(--alert-warning-dark)}.lq-hero-due .due-week,.lq-hero-due .due-later{color:var(--ink-2)}
.lq-hero-w{color:var(--muted);font-weight:500}
.lq-hero-start{margin-top:auto;display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:8px 22px 8px 16px;border:0;border-radius:999px;background:var(--prim-slate-800);color:#fff;font-size:16px;font-weight:700;transition:background .15s}
.lq-hero-start:hover{background:var(--prim-slate-900)}
.lq-hero-start:focus-visible{outline:3px solid var(--prim-admin-blue-400);outline-offset:3px}
.lq-hero-ctrls{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:4px}
.lq-hero-pos{margin-right:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.lq-mini{position:relative;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}
.lq-mini:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.lq-mini:disabled{opacity:.35}
.lq-mini[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 8px;border-radius:6px;background:#0F172A;color:#fff;font-size:11.5px;font-weight:600;pointer-events:none;z-index:5}
.lq-hero-main.is-out{animation:lqOut .16s ease-in forwards}
.lq-hero-main.is-in{animation:lqIn .26s ease-out}
@media (max-width:760px){.lq-hero{flex-direction:column}.lq-hero-ctrls{position:static;justify-content:flex-end}.lq-hero-art{flex-basis:auto;min-height:110px}}
@media (prefers-reduced-motion:reduce){.lq-hero-main.is-out,.lq-hero-main.is-in{animation:none}}

/* ===== Persistent visible scrollbar for the Coming up list ===== */
.lq-rows.is-scroll{overflow-y:scroll;scrollbar-width:auto;scrollbar-color:var(--prim-slate-400) var(--prim-slate-100);padding-right:8px;-webkit-mask-image:none;mask-image:none;padding-bottom:0;border-radius:12px}
.lq-rows.is-scroll::-webkit-scrollbar{width:10px;-webkit-appearance:none}
.lq-rows.is-scroll::-webkit-scrollbar-track{background:var(--prim-slate-100);border-radius:99px}
.lq-rows.is-scroll::-webkit-scrollbar-thumb{background:var(--prim-slate-400);border-radius:99px;border:2px solid var(--prim-slate-100)}
.lq-rows.is-scroll::-webkit-scrollbar-thumb:hover{background:var(--prim-slate-500)}
/* custom persistent scroll rail */
.srail-wrap{position:relative}
.srail-wrap.is-on .lq-rows{padding-right:20px;scrollbar-width:none}
.srail-wrap.is-on .lq-rows::-webkit-scrollbar{display:none}
.srail{position:absolute;top:2px;bottom:2px;right:0;width:10px;border-radius:99px;background:var(--prim-slate-100);cursor:pointer}
.srail-thumb{position:absolute;left:1px;right:1px;border-radius:99px;background:var(--prim-slate-400);transition:background .15s}
.srail:hover .srail-thumb{background:var(--prim-slate-500)}
.confetti{position:fixed;inset:0;z-index:90;pointer-events:none}

/* ===== K-5 alternate progress map: illustrated desk scene ===== */
.desk-map{position:relative;margin:14px -8px 6px;height:340px;border-radius:20px;background-size:cover;background-position:center 78%;overflow:hidden}
.desk-map::after{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(180deg,transparent,rgba(120,50,10,.18));pointer-events:none}
.dm-track{position:absolute;left:8%;right:9%;bottom:58px;height:0;z-index:1}
.dm-road{position:absolute;left:0;right:0;top:-5px;height:10px;border-radius:99px;background:rgba(255,246,224,.55);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.dm-road-done{position:absolute;left:0;top:-5px;height:10px;border-radius:99px;background:#65D4A5;transition:width .6s cubic-bezier(.3,1.2,.5,1)}
.dm-node{position:absolute;top:0;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:#fff;border:4px solid var(--node);color:var(--node-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:900;font-size:14px;box-shadow:0 3px 0 rgba(90,35,5,.35)}
.dm-node.is-done{background:var(--node);border-color:#fff}
.dm-node.is-next{box-shadow:0 0 0 5px rgba(255,255,255,.6),0 3px 0 rgba(90,35,5,.35)}
.dm-flag{position:absolute;top:0;width:46px;height:46px;margin:-23px 0 0 -10px;border-radius:50%;background:#FFE7A8;border:4px solid #FFBD26;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(90,35,5,.35)}
.dm-flag.is-done{background:#FFBD26}
.dm-me{position:absolute;bottom:22px;width:52px;height:52px;margin-left:-26px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--color-primary-base),0 6px 12px rgba(60,20,0,.35);display:flex;align-items:center;justify-content:center;transition:left .8s cubic-bezier(.3,1.3,.5,1)}
.dm-me::after{content:"";position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top-color:var(--color-primary-base);border-bottom:0}
.dm-me svg{border-radius:50%}
.dm-cap{position:absolute;top:28px;font-family:var(--display);font-weight:900;font-size:14px;color:#FFF6E0;text-shadow:0 2px 0 rgba(90,35,5,.5);white-space:nowrap}
.dm-cap.is-start{left:0;transform:translateX(-50%)}
.dm-cap.is-end{left:100%;transform:translateX(-40%)}
@media (prefers-reduced-motion:reduce){.dm-me,.dm-road-done{transition:none}}
.desk-map{height:440px;background-size:cover;background-position:center bottom}.dm-track{bottom:64px}
/* meadow progress map (replaces desk map); full image, 3:1 */
.meadow{position:relative;margin:12px -8px 6px;aspect-ratio:3/1;border-radius:20px;background-size:100% 100%;background-repeat:no-repeat}
.meadow .dm-node{position:absolute;margin:-18px 0 0 -18px;z-index:1}
.meadow .dm-flag{position:absolute;margin:-23px 0 0 -23px;z-index:1}
.meadow .dm-me{position:absolute;bottom:auto;margin:-86px 0 0 -26px;z-index:2;transition:left .8s cubic-bezier(.3,1.3,.5,1),top .8s cubic-bezier(.3,1.3,.5,1)}
@media (prefers-reduced-motion:reduce){.meadow .dm-me{transition:none}}
/* K-5 cards: activities read as a simple checklist */
.k5-card.has-art .k5-acts{gap:0}
.k5-card.has-art .k5-act{min-height:32px;padding:3px 6px;border-radius:8px;background:transparent!important;box-shadow:none!important;border:0}
.k5-card.has-art .k5-act:hover{background:rgba(255,255,255,.45)!important}
.k5-card.has-art .k5-go{display:none}
.k5-card.has-art .k5-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--subject-ink);background:rgba(255,255,255,.75)}
.k5-card.has-art .k5-act.is-done .k5-check{background:var(--subject-ink);border-color:var(--subject-ink);color:#fff}
.k5-card.has-art .k5-act.is-done{opacity:1}
.k5-card.has-art .k5-act.is-done .k5-act-t,.k5-card.has-art .k5-act.is-done > span:last-child{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--subject-ink) 45%,transparent);color:color-mix(in srgb,var(--subject-ink) 65%,transparent)}
/* assignments list: no numbers; locked rows link to their prerequisite */
.lq-row-main{grid-template-columns:36px minmax(0,1fr) 110px 120px!important}
.lq-row-main.is-static{cursor:default}
.lq-row-main.is-static:hover{background:transparent}
.lq-prereq{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;margin-top:1px;padding:2px 10px 2px 8px;border:1px solid var(--color-primary-light);border-radius:999px;background:var(--color-primary-subtle);color:var(--color-primary-darker);font-size:12.5px;font-weight:800;cursor:pointer}
.lq-prereq:hover{background:var(--color-primary-lighter)}
.lq-prereq:focus-visible{outline:2px solid var(--color-primary-dark);outline-offset:2px}
.lq-row.is-on{background:var(--prim-slate-100);box-shadow:inset 3px 0 0 var(--prim-slate-700)}

/* ===== dependency chains in the assignments list ===== */
.lq-chain{position:relative;margin:6px 0;padding:8px 8px 6px 10px;border-radius:14px;border:1px solid var(--color-primary-light);background:linear-gradient(180deg,var(--color-primary-subtle),#fff 60%)}
.lq-chain-h{display:flex;align-items:center;gap:6px;padding:0 4px 4px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--color-primary-darker)}
.lq-chain .lq-row{border-bottom:0;background:#fff;border-radius:10px;padding-left:4px}
.lq-row.is-step{display:flex;align-items:center}
.lq-step-n{flex-shrink:0;width:24px;height:24px;margin-left:4px;border-radius:50%;background:var(--color-primary-dark);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;position:relative;z-index:1}
.lq-step-n.is-locked{background:#fff;color:var(--color-primary-darker);border:2px dashed var(--color-primary-base)}
.lq-chain-link{position:relative;height:22px;margin-left:15px}
.lq-chain-link::before{content:"";position:absolute;left:0;top:-6px;bottom:-6px;width:2px;background:var(--color-primary-base)}
.lq-chain-link::after{content:"";position:absolute;left:-4px;bottom:-4px;border:5px solid transparent;border-top-color:var(--color-primary-base);border-bottom:0}
.lq-chain-link span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:700;color:var(--color-primary-darker)}
.lq-lock-note{color:var(--color-primary-dark)!important;font-weight:700}
.lq-chain .lq-row-main{grid-template-columns:36px minmax(0,1fr) 110px 120px!important}
.lq-chain-link{margin-left:19px;height:18px}.lq-chain-link::before{top:-14px;bottom:-12px}.lq-chain-link::after{bottom:-12px}.lq-chain .lq-row.is-locked{background:rgba(255,255,255,.7)}

/* selected row: brighter highlight, no left stroke */
.lq-row.is-on{background:var(--brand-blue-soft)!important;box-shadow:inset 0 0 0 1px var(--brand-blue-line)!important;border-radius:12px}
.lq-row.is-on .lq-row-main:hover{background:transparent}
/* breathing room in the assignments header */
.lq-list-head{gap:16px;margin-bottom:14px}
.lq-list-h{margin-bottom:2px}
/* shorter list (about 8 rows), still scrolls inside */
.lq-rows.is-scroll{max-height:calc(8 * 58px)}
/* I'm feeling lucky */
.lq-lucky{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);font-size:12.5px;font-weight:800;white-space:nowrap}
.lq-lucky:hover:not(:disabled){background:#EAF8EE;border-color:#9ED9B0;color:#1F6B3A}
.lq-lucky:disabled{opacity:.4}
.lq-hero-ctrls{position:absolute}
.lucky-float{position:absolute;right:40px;top:30px;font-size:30px;pointer-events:none;animation:luckyUp 1.4s ease-out forwards;z-index:5}
@keyframes luckyUp{0%{opacity:0;transform:translateY(10px) scale(.6) rotate(-10deg)}20%{opacity:1;transform:translateY(0) scale(1.15) rotate(6deg)}100%{opacity:0;transform:translateY(-70px) scale(1) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.lucky-float{animation:luckyFade 1.2s ease-out forwards}@keyframes luckyFade{0%,60%{opacity:1}100%{opacity:0}}}
/* needs-attention grade: icon instead of the letter, supportive tooltip */
.side .launcher .grade-tile.is-low{color:#B45309!important;box-shadow:inset 0 0 0 2px #F5B85A!important;background:#FFF8EB!important}
.grade-tile:hover::after{white-space:pre-line;text-align:left;line-height:1.35}
.grade-tile.is-low:hover::after{left:calc(100% + 8px);bottom:auto;top:50%;transform:translateY(-50%);width:170px;font-weight:600}
/* left menu stays put while content scrolls */
.shell{align-items:flex-start}
.side{position:sticky;top:0;height:calc(100vh - 66px);align-self:flex-start}
.side{height:100vh}
/* fixed top bar + fixed left menu; only the main content scrolls */
.topbar{position:sticky;top:0;z-index:40}
.side{top:66px!important;height:calc(100vh - 66px)!important}
/* math = true blue (custom family built from the admin-blue primitives) */
:root{--color-math-blue-subtle:var(--prim-admin-blue-50,#EFF6FF);--color-math-blue-lighter:var(--prim-admin-blue-100);--color-math-blue-light:var(--prim-admin-blue-200);--color-math-blue-base:var(--prim-admin-blue-400);--color-math-blue-dark:var(--prim-admin-blue-600);--color-math-blue-darker:var(--prim-admin-blue-800)}
.lq-title-row{display:flex;align-items:center;gap:4px}
.lq-title-row .info-pop{width:270px}
.lq-lucky-ic:hover:not(:disabled){background:#EAF8EE;border-color:#9ED9B0;color:#1F6B3A}.lucky-float{right:12px;top:26px}
.lq-lucky-ic[data-tip]:hover::after{left:auto;right:0;transform:none}

/* ===== Daily check-in (6-12) ===== */
.home-612 > *{transition:opacity .35s ease,filter .35s ease}
.home-612.is-checkin > :not(.checkin):not(.greet):not(.bl-wrap){opacity:.22;filter:blur(1.5px) saturate(.6);pointer-events:none;user-select:none}
.checkin{padding:22px 24px 16px;border-radius:24px;background:linear-gradient(135deg,#F4F0FF,#EEF7FF 55%,#F0FBF5);border:1px solid #DCD3F5;box-shadow:0 18px 40px -24px rgba(91,42,134,.45);animation:ciIn .4s cubic-bezier(.2,.9,.3,1.1)}
@keyframes ciIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.ci-h{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.ci-sub{margin-top:4px;color:var(--ink-2);font-size:15px}
.ci-opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:900px){.ci-opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ci-opt{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 12px;border-radius:18px;border:2px solid #fff;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ci-line),0 10px 20px -16px rgba(15,23,42,.4);transition:transform .15s,border-color .15s}
.ci-opt:hover,.ci-opt:focus-visible{transform:translateY(-3px);border-color:var(--ci-line);outline:none}
.ci-face{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--ci-bg)}
.ci-face svg{fill:none;stroke:var(--ci-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ci-face svg circle{fill:#fff;stroke:var(--ci-ink)}
.ci-face.sm{width:34px;height:34px;flex-shrink:0}
.ci-opt:hover .ci-face svg{animation:ciBob .5s ease}
@keyframes ciBob{50%{transform:translateY(-3px) rotate(-4deg)}}
.ci-label{font-family:var(--display);font-weight:800;font-size:16px}
.ci-desc{font-size:13px;color:var(--muted)}
.ci-skip{display:block;margin:12px auto 0;font-size:13.5px}
.tone-green{--ci-bg:#DDF5E8;--ci-ink:#1F6B3A;--ci-line:#9ED9B0}
.tone-amber{--ci-bg:#FFF1D6;--ci-ink:#8A5A00;--ci-line:#F5CF85}
.tone-blue{--ci-bg:#DBEAFE;--ci-ink:#1E40AF;--ci-line:#A9C8F7}
.ci-opt.tone-purple,.ci-chip.tone-purple{--ci-bg:#ECE3F8;--ci-ink:#5B2A86;--ci-line:#C9B3EA}
.ci-chip{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:999px;background:var(--ci-bg);border:1px solid var(--ci-line);font-size:14px;color:var(--ink);align-self:flex-start;animation:ciIn .3s ease-out}
.ci-chip .link-btn{margin-left:6px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){.checkin,.ci-chip,.ci-opt:hover .ci-face svg{animation:none}.home-612 > *{transition:none}}
/* check-in confirmation behaves like a flash message */
.ci-flash{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:60;overflow:hidden;box-shadow:0 14px 30px -14px rgba(15,23,42,.35);animation:flashIn .35s cubic-bezier(.2,.9,.3,1.2),flashOut .4s ease-in 5.6s forwards;padding-right:8px}
@keyframes flashIn{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes flashOut{to{opacity:0;transform:translate(-50%,-10px)}}
.ci-x{width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}
.ci-x:hover{background:rgba(255,255,255,.7)}
.ci-timer{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--ci-ink);opacity:.35;transform-origin:left;animation:ciTimer 6s linear forwards}
@keyframes ciTimer{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.ci-flash{animation:none}.ci-timer{animation:none;display:none}}
.greet-sub{animation:fadein .4s ease-out}

/* ===== Prerequisite paths, threaded like comment replies (lighter than the purple box) ===== */
.lq-chain{display:none}
.lq-thread{margin:6px 0 10px;padding:2px 0 2px}
.lq-thread-h{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:8px 8px 6px}
.lq-thread-ic{width:26px;height:26px;border-radius:8px;background:var(--prim-slate-100);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}
.lq-thread-t{font-size:14px;color:var(--ink-2)}
.lq-thread-t strong{color:var(--ink)}
.lq-thread-m{font-size:12.5px;color:var(--muted)}
.lq-thread-tg{margin-left:auto;font-size:13px}
.lq-thread-body{position:relative;margin-left:20px;padding-left:24px}
.lq-thread-body::before{content:"";position:absolute;left:0;top:-4px;bottom:26px;width:2px;border-radius:2px;background:var(--prim-slate-200)}
.lq-step{position:relative}
.lq-step::before{content:"";position:absolute;left:-24px;top:50%;width:16px;height:2px;background:var(--prim-slate-200)}
.lq-node{position:absolute;left:-35px;top:50%;margin-top:-12px;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;z-index:1}
.lq-node.is-ready{background:var(--prim-slate-800);color:#fff}
.lq-node.is-locked{background:#fff;color:var(--muted);border:2px dashed var(--prim-slate-300)}
.lq-node.is-goal{background:#FFF1D6;color:#8A5A00;border:2px solid #F5CF85}
.lq-thread .lq-row{border-bottom:0;border-radius:10px}
.lq-thread .lq-row.is-locked .lq-row-title,.lq-thread .lq-row.is-locked .lq-ico{opacity:.7}
.lq-thread .lq-lock-note{color:var(--muted)!important;font-weight:600}
.lq-thread-more{position:relative;display:inline-flex;align-items:center;gap:8px;margin:2px 0 2px -6px;padding:4px 10px;border:0;border-radius:999px;background:transparent;color:var(--link);font-size:13px;font-weight:700;cursor:pointer}
.lq-thread-more:hover{background:var(--hover)}
.lq-thread-more-dots{width:14px;height:4px;background:radial-gradient(circle,var(--prim-slate-400) 1.5px,transparent 2px) 0 0/5px 4px repeat-x}
.lq-step.is-goal .lq-row-title{font-weight:800}
.lq-thread .lq-row.is-locked .lq-row-title{color:var(--prim-slate-400);opacity:1}.lq-thread .lq-row.is-locked .lq-row-title svg{color:var(--prim-slate-400)}
/* grade tiles show percentages */
.side .launcher .grade-tile{font-size:11px;letter-spacing:-.01em}
/* progress caption: smaller, clearly about the bar */
.launcher-hmeta{font-size:10.5px!important;font-weight:600!important}
/* done-today tracker */
.greet{position:relative}
.done-wrap{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.done-chip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:4px 12px 4px 5px;border-radius:999px;border:1px solid #9ED9B0;background:#EAF8EE;color:#1F6B3A;font-size:13px;font-weight:800}
.done-chip:hover{background:#DDF3E4}
.done-chip.is-pop{animation:donePop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes donePop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.done-ic{width:22px;height:22px;border-radius:50%;background:#2F9E5B;color:#fff;display:inline-flex;align-items:center;justify-content:center}
.done-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:31;width:320px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px -16px rgba(15,23,42,.3);animation:fadein .15s ease-out}
.done-pop-h{display:flex;align-items:center;gap:8px;padding:2px 4px 8px;font-weight:800;font-size:14px}
.done-pop-h span{padding:0 8px;border-radius:99px;background:#EAF8EE;color:#1F6B3A;font-size:12px}
.done-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.done-item:hover{background:var(--hover)}
.done-item-ic{width:22px;height:22px;flex-shrink:0;border-radius:50%;background:var(--subject-soft);color:var(--subject-ink);display:inline-flex;align-items:center;justify-content:center}
.done-item .grow{display:flex;flex-direction:column;min-width:0}
.done-item-t{font-size:13.5px;font-weight:700;color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--prim-slate-300)}
.done-item-m{font-size:12px;color:var(--muted)}
.done-pop-f{margin-top:6px;padding:8px 6px 2px;border-top:1px solid var(--line);font-size:12.5px;color:#1F6B3A;font-weight:700}
@media (prefers-reduced-motion:reduce){.done-chip.is-pop{animation:none}}
.greet{display:flex;align-items:center;flex-wrap:wrap;column-gap:12px}
.done-wrap{position:relative;right:auto;top:auto;transform:none;order:3}
.done-pop{left:0;right:auto}
/* 6-12 My Courses: percentages not bold */
.side .launcher .grade-tile{font-weight:500!important;font-family:var(--body)}
/* K-5 course cards: grade level 1–3 in the badge */
.k5-level{flex-direction:column;gap:0;line-height:1}
.k5-level-k{font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--subject-ink);opacity:.7}
.k5-level-n{font-family:var(--display);font-size:36px;font-weight:900;color:var(--subject-ink)}
/* numbers: dark subject color on a light subject fill */
.side .launcher .grade-tile{background:var(--subject-soft)!important;color:var(--subject-ink)!important;box-shadow:none!important;font-weight:600!important}
.side .launcher:hover .grade-tile,.side .launcher:focus-visible .grade-tile{background:#fff!important}
.side .launcher .grade-tile.is-low{background:#FFEFD2!important;color:#9A4A06!important}
.k5-card.has-art .k5-level{background:var(--subject-soft)!important;border-color:#fff!important}
.k5-level-n,.k5-level-k{color:var(--subject-ink)}
.side .launcher .grade-tile.is-low{box-shadow:none!important}

/* ===== Version: greeting + live sessions as one block; learning queue stands alone ===== */
.greet-combo{border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(15,23,42,.05);overflow:visible}
.greet-combo .greet{margin:0!important;padding:18px 22px 14px;border-bottom:1px solid var(--line);background:linear-gradient(120deg,#F5F8FF,#fff 60%);border-radius:24px 24px 0 0}
.greet-combo .lth-card{border:0!important;border-radius:0 0 24px 24px!important;background:transparent!important;box-shadow:none!important;margin:0!important}
.greet-combo .lth-card .lth-side{border-radius:0 0 0 24px}
.greet-combo + .lq{margin-top:-6px!important;border-radius:26px!important;border:1px solid var(--line)!important;box-shadow:0 18px 40px -22px rgba(15,23,42,.35),0 2px 6px rgba(15,23,42,.04)!important}
.home-612:has(.bl-wrap) .greet-combo{margin-top:48px}
.bl-wrap + .checkin{margin-top:48px}
.checkin + .greet-combo{margin-top:0!important}
.k5-level-n{font-size:40px}
/* session details modal */
.si .br-icon{background:var(--c-soft)}
.si-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px}
@media (max-width:560px){.si-facts{grid-template-columns:1fr}}
.si-fact{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.si-fact div{display:flex;flex-direction:column}
.si-fact strong{color:var(--ink);font-size:15px}
.si-fact span{font-size:13px;color:var(--muted)}
.si-av{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:var(--c-soft);color:var(--c-ink);display:inline-flex!important;align-items:center;justify-content:center;font-weight:800;font-size:13px!important}
.si-sub{margin:6px 0 2px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.si .br-body p{font-size:15.5px}
.pill{cursor:pointer}
.pill:focus-visible{outline:3px solid var(--prim-admin-blue-400);outline-offset:2px}
</style>

<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

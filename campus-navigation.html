/* App roles mapped onto the Teacher tokens (slate neutral base) */
:root{
  --accent:var(--buttons-button-primary-background);
  --accent-hover:var(--buttons-button-primary-hover);
  --accent-soft:var(--color-primary-subtle);
  --accent-ink:var(--color-primary-darker);
  --link:var(--typography-text-link);
  --link-hover:var(--typography-text-link-hover);
  --bg:var(--prim-slate-50);
  --surface:var(--card-card-bg);
  --surface-2:var(--input-solid-bg-default);
  --surface-3:var(--foregrounds-and-backgrounds-background-color-medium);
  --hover:var(--buttons-button-outline-hover);
  --line:var(--prim-slate-200);
  --line-2:var(--buttons-button-outline-outline);
  --ink:var(--typography-text-base);
  --ink-2:var(--buttons-button-outline-text);
  --muted:var(--typography-text-muted);
  --muted-2:var(--typography-text-muted);
  --select-bg:var(--foregrounds-and-backgrounds-background-color-dark);
  --select-ink:var(--typography-text-light);
  --nav-on-bg:var(--prim-slate-100);
  --nav-on-ink:var(--prim-slate-900);
  --hero-from:var(--prim-admin-blue-50);
  --hero-to:var(--prim-slate-50);
  --brand-blue:var(--prim-admin-blue-500);
  --brand-blue-soft:var(--prim-admin-blue-50);
  --brand-blue-line:var(--prim-admin-blue-200);
  --brand-blue-ink:var(--prim-admin-blue-900);
  --live:var(--color-accent-color-2-base);--live-ink:var(--color-accent-color-2-darker);--now:var(--color-accent-color-2-dark);
  --shadow:0 12px 32px rgba(15,23,42,.12);
  --r-card:var(--card-card-corner);--r-btn:var(--buttons-button-primary-corner);--r-input:var(--input-input-corner);
  --r-label:var(--label-label-corner);--r-tag:var(--tag-tag-corner);--r-menu:var(--dropdown-menu-dropdown-menu-corner);
  --r-menu-item:var(--dropdown-menu-dropdown-menu-item-corner);--r-avatar:var(--user-circle-user-circle-corner);--r-alert:var(--alert-alert-corner);
  --display:'Nunito Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Nunito Sans','Avenir Next','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:var(--prim-slate-950);--surface:var(--prim-slate-900);--surface-2:var(--prim-slate-800);--surface-3:var(--prim-slate-800);--hover:var(--prim-slate-800);
    --line:var(--prim-slate-800);--line-2:var(--prim-slate-700);--ink:var(--prim-slate-50);--ink-2:var(--prim-slate-200);--muted:var(--prim-slate-400);--muted-2:var(--prim-slate-400);
    --select-bg:var(--prim-slate-100);--select-ink:var(--prim-slate-900);--nav-on-bg:var(--prim-slate-800);--nav-on-ink:var(--prim-slate-50);
    --hero-from:#16224A;--hero-to:var(--prim-slate-900);--brand-blue-soft:#16224A;--brand-blue-line:var(--prim-admin-blue-800);--brand-blue-ink:var(--prim-admin-blue-100);
    --link:var(--color-accent-color-5-light);--link-hover:var(--color-accent-color-5-lighter);
    --shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:var(--prim-slate-950);--surface:var(--prim-slate-900);--surface-2:var(--prim-slate-800);--surface-3:var(--prim-slate-800);--hover:var(--prim-slate-800);
  --line:var(--prim-slate-800);--line-2:var(--prim-slate-700);--ink:var(--prim-slate-50);--ink-2:var(--prim-slate-200);--muted:var(--prim-slate-400);--muted-2:var(--prim-slate-400);
  --select-bg:var(--prim-slate-100);--select-ink:var(--prim-slate-900);--nav-on-bg:var(--prim-slate-800);--nav-on-ink:var(--prim-slate-50);
  --hero-from:#16224A;--hero-to:var(--prim-slate-900);--brand-blue-soft:#16224A;--brand-blue-line:var(--prim-admin-blue-800);--brand-blue-ink:var(--prim-admin-blue-100);
  --link:var(--color-accent-color-5-light);--link-hover:var(--color-accent-color-5-lighter);
  --shadow:0 12px 32px rgba(0,0,0,.5);color-scheme:dark;
}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
p{margin:0}
img{max-width:100%}

/* type */
.h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,3.2vw,38px);line-height:1.15;letter-spacing:-.02em}
.h2{margin:0;font-family:var(--display);font-weight:800;font-size:14px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.h3{margin:0 0 6px;font-size:16px;font-weight:700}
.lede{margin-top:6px;color:var(--muted)}
.strong{font-weight:650;font-weight:600}
.lg{font-size:17px}
.muted{color:var(--muted)}
.muted-sm{font-size:13px;color:var(--muted)}
.muted-xs{font-size:12px;color:var(--muted);margin-top:4px}
.fresh{font-size:12px;color:var(--muted-2)}
.label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px;padding:0}
.measure{max-width:68ch;color:var(--ink-2)}
.tone-ok{color:var(--alert-success-dark)}.tone-warn{color:var(--typography-text-warning)}.tone-danger{color:var(--alert-error-dark)}

/* utilities */
.grow{flex:1;min-width:0}
.spacer{flex:1 1 0}
.stack-8{display:flex;flex-direction:column;gap:8px}
.stack-12{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.stack-14{display:flex;flex-direction:column;gap:14px}
.stack-16{display:flex;flex-direction:column;gap:16px}
.stack-18{display:flex;flex-direction:column;gap:18px}
.stack-20{display:flex;flex-direction:column;gap:20px}
.row-wrap{display:flex;flex-wrap:wrap;gap:10px}
.row-wrap.center{justify-content:center}
.align-center{align-items:center;gap:18px}
.mt-8{margin-top:8px}.mt-10{margin-top:10px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}
.pad-8{padding:8px 4px}.pad-14{padding:14px 0}
.narrow{max-width:800px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r-btn);border:1px solid transparent;font-weight:650;font-weight:600;line-height:1.2;text-decoration:none}
.btn-sm{min-height:40px;padding:6px 14px;font-size:14px}
.btn-accent{background:var(--accent);color:var(--buttons-button-primary-text);font-weight:700}
.btn-accent:hover{background:var(--accent-hover)}
.btn-subject{background:var(--subject-ink,var(--accent));color:var(--typography-text-light);font-weight:700}
.btn-subject:hover{filter:brightness(1.25)}
.btn-outline{background:var(--surface);border-color:var(--line-2);color:var(--ink-2)}
.btn-outline:hover{background:var(--hover)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-danger{background:var(--alert-error-dark);color:var(--typography-text-light);font-weight:700}
.btn-join{min-height:32px;padding:3px 16px;border-radius:var(--r-btn);background:var(--accent);color:var(--buttons-button-primary-text);font-weight:700;font-size:14px}
.btn-ghost-inv{background:transparent;color:inherit;border-color:rgba(255,255,255,.35);min-height:40px;padding:6px 14px;font-size:14px}
.link-btn{border:0;background:transparent;padding:6px 0;font-weight:600;font-size:14px;color:var(--link)}
.link-btn:hover{color:var(--link-hover);text-decoration:underline}
.icon-btn{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.icon-btn .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--now);border:2px solid var(--surface)}
.avatar{width:44px;height:44px;border-radius:var(--r-avatar);border:0;background:var(--brand-blue);color:var(--user-circle-user-circle-font);font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar.xl{width:84px;height:84px;font-size:28px;border-radius:calc(var(--r-avatar)*2)}

/* header */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;border-radius:var(--r-avatar);font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-family:var(--display);font-weight:700;font-size:17px}
.brand-org{font-size:12px;color:var(--muted)}
.pop-wrap{position:relative}
.pop{position:absolute;top:calc(100% + 8px);background:var(--dropdown-menu-dropdown-menu-bg);border:1px solid var(--line);border-radius:var(--r-menu);box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:20}
.pop-left{left:0;width:290px}
.pop-right{right:0;width:250px}
.pop-org{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 10px;border:0;border-radius:var(--r-menu-item);background:transparent;text-align:left}
.pop-org:hover,.pop-org.is-current{background:var(--dropdown-menu-dropdown-menu-item-hover)}
.pop-org-text{display:flex;flex-direction:column;flex:1;line-height:1.3}
.pop-org-text span{font-size:12px;color:var(--muted)}
.org-mark{width:32px;height:32px;border-radius:var(--r-avatar);font-weight:700;display:flex;align-items:center;justify-content:center}
.pop-who{padding:10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column}
.pop-who span{font-size:13px;color:var(--muted)}
.pop-item{min-height:44px;padding:8px 12px;border:0;border-radius:var(--r-menu-item);background:transparent;text-align:left}
.pop-item:hover{background:var(--dropdown-menu-dropdown-menu-item-hover)}
.pop-item.muted{color:var(--muted)}

/* shell */
.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100vh - 66px)}
.side{flex:1 1 220px;max-width:100%;background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.main{flex:999 1 560px;min-width:0;padding:24px 28px 96px}
.wrap{max-width:1140px;margin:0 auto}
.side-h{margin:0 10px 4px;font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.side-sub{margin:0 10px 10px;font-size:12px;color:var(--muted)}

/* course launchers */
.launchers{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.launcher .subject-tile{width:32px;height:32px;font-size:12px;border-radius:9px}
.launcher-play{width:26px!important;height:26px!important}
.launcher{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:12px;border:1px solid transparent;background:transparent;text-align:left;transition:border-color .15s,box-shadow .15s,transform .15s}
.launcher:hover{background:var(--hover);border-color:var(--line)}
.launcher:hover .launcher-play{background:var(--subject-ink);color:var(--typography-text-light)}
.subject-tile{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:var(--subject-soft);color:var(--subject-ink);font-family:var(--display);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.02em}
.subject-tile.sm{width:30px;height:30px;font-size:12px;border-radius:8px}
.subject-tile.lg{width:64px;height:64px;font-size:22px;border-radius:16px}
.subject-tile.xl{width:88px;height:88px;font-size:30px;border-radius:22px}
.launcher-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.launcher-name{font-weight:800;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.launcher-lesson{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.launcher-bar{display:block;height:4px;border-radius:99px;background:var(--progress-bar-progress-track);overflow:hidden;margin-top:3px}
.launcher-bar span{display:block;height:100%;background:var(--progress-bar-progress-bar);border-radius:99px}
.launcher-play{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--subject-ink);background:var(--subject-soft);transition:background .15s,color .15s}
.launcher-play svg{margin-left:2px;fill:currentColor}

/* nav */
.side-nav{display:flex;flex-direction:column;gap:2px;padding-top:20px;border-top:1px solid var(--line)}
.side-nav .side-h{margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 12px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:15px;font-weight:500;color:var(--ink-2)}
.nav-item:hover{background:var(--hover)}
.nav-item.is-active{background:var(--nav-on-bg);color:var(--nav-on-ink);font-weight:800}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.card.pad-24{padding:24px}.card.pad-28{padding:28px}.card.pad-32{padding:32px}
.card.dashed{border-style:dashed;border-color:var(--line-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-20px -20px 16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-card) var(--r-card) 0 0}
.list-card{padding:4px 20px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(270px,1fr);gap:20px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.col-main{min-width:0;display:flex;flex-direction:column;gap:20px}
.col-side{min-width:0;display:flex;flex-direction:column;gap:20px}

/* broadcast */
.broadcast{display:flex;gap:14px;align-items:flex-start;padding:16px 14px 16px 18px;border-radius:var(--r-alert);background:var(--brand-blue-soft);border:1px solid var(--brand-blue-line);color:var(--ink)}
.broadcast-icon{width:36px;height:36px;flex-shrink:0;border-radius:var(--r-avatar);background:var(--brand-blue);color:#fff;display:flex;align-items:center;justify-content:center}
.broadcast-from{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-blue-ink)}
.broadcast-title{font-weight:700;font-size:16px;margin-top:1px}
.broadcast-body{color:var(--ink-2)}
.broadcast .icon-btn:hover{background:var(--brand-blue-line)}

/* chips & tabs */
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:var(--r-label);line-height:1.5;white-space:nowrap}
.chip-danger{background:var(--label-label-red-bg);color:var(--label-label-red-text)}
.chip-warn{background:var(--label-label-yellow-bg);color:var(--label-label-yellow-text)}
.chip-ok{background:var(--label-label-green-bg);color:var(--label-label-green-text)}
.chip-neutral{background:var(--prim-slate-100);color:var(--prim-slate-700)}
.chip-quiz{background:var(--label-label-purple-bg);color:var(--label-label-purple-text)}
.chip-info{background:var(--label-label-blue-bg);color:var(--label-label-blue-text)}
.chip-exam{background:var(--tooltip-tooltip-dark-bg);color:var(--typography-text-light)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:var(--r-tag);border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
.tab.is-on{background:var(--select-bg);border-color:var(--select-bg);color:var(--select-ink)}
.tab-n{min-width:22px;padding:0 6px;border-radius:99px;font-size:12px;line-height:20px;text-align:center;background:var(--surface-3);color:var(--ink)}
.tab.is-on .tab-n{background:var(--prim-slate-600);color:var(--prim-slate-0)}

/* work */
.group{margin-top:18px}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.work-row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);text-align:left}
.work-row:hover{border-color:var(--line-2);background:var(--surface-2)}
.work-main{flex:1;min-width:0}
.work-title-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.work-title{font-weight:600}
.work-meta{font-size:13px;color:var(--muted);margin-top:4px}
.work-side{text-align:right;flex-shrink:0}
.work-due{font-size:13px;font-weight:700}
.work-cta{font-size:13px;font-weight:700;color:var(--link);margin-top:2px}
.grade-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r-card);background:var(--surface-2)}
.grade-pill{width:72px;flex-shrink:0;text-align:center;padding:6px 4px;border-radius:var(--r-label);font-weight:700;font-size:11px;line-height:1.2;background:var(--prim-slate-100);color:var(--prim-slate-700)}
.grade-pill.is-graded{font-size:17px;background:var(--alert-success-light);color:var(--alert-success-dark)}
.state-box{margin-top:6px;padding:18px;border-radius:var(--r-card);background:var(--surface-2);color:var(--muted);display:flex;gap:14px;align-items:flex-start}
.state-box.center{flex-direction:column;align-items:center;text-align:center;gap:4px}
.state-box strong{color:var(--ink);display:block}
.state-box p{margin:2px 0 0}
.warnbox{background:var(--alert-warning-light);color:var(--alert-warning-dark);border:0;border-radius:var(--r-alert)}
.warnbox strong{color:var(--alert-warning-dark)}
.warnbox .btn{margin-top:12px}

/* timeline */
.tl{position:relative;margin:8px 0 6px}
.tl-rail{position:absolute;left:56px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-rail-past{position:absolute;left:56px;top:0;width:2px;background:var(--prim-slate-400);transition:height 1s linear}
.tl-hour{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--line)}
.tl-hour span{position:absolute;top:-9px;left:0;width:48px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);text-align:right;padding-right:4px}
.tl-block{position:absolute;left:68px;right:0;display:flex;flex-direction:column;gap:1px;padding:9px 10px 9px 12px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);overflow:hidden;transition:opacity .4s,border-color .3s,background .3s}
.tl-dot{position:absolute;left:-17px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tl-block{overflow:visible}
.tl-b-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px;min-height:30px}
.tl-b-title{flex-shrink:0;font-weight:700;font-size:14px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b-meta{flex-shrink:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tl-badge{font-size:11px;font-weight:700;padding:1px 8px;border-radius:var(--r-label);background:var(--neutral-bg);color:var(--neutral);white-space:nowrap}
.tl-block.is-next{border-color:var(--brand-blue-line)}
.tl-block.is-next .tl-dot{border-color:var(--brand-blue)}
.tl-block.is-soon{background:var(--brand-blue-soft);border-color:var(--brand-blue-line)}
.tl-badge.is-soon{background:var(--prim-admin-blue-100);color:var(--prim-admin-blue-900)}
.tl-block.is-live{background:var(--color-accent-color-2-subtle);border-color:var(--live);box-shadow:0 0 0 3px var(--color-accent-color-2-lighter)}
.tl-block.is-live .btn-join{background:var(--accent)}
.tl-block.is-live .tl-dot{background:var(--live);border-color:var(--live);animation:pulse 1.6s ease-out infinite}
.tl-badge.is-live{background:var(--live);color:var(--live-ink)}
.tl-block.is-ended{opacity:.55}
.tl-block.is-ended .tl-dot{background:var(--prim-slate-400);border-color:var(--prim-slate-400)}
.tl-badge.is-ended{background:transparent;color:var(--muted);padding-right:0}
.tl-now{position:absolute;left:44px;right:-6px;height:0;border-top:2px solid var(--now);z-index:3;transition:top 1s linear;pointer-events:none}
.tl-now::before{content:"";position:absolute;left:7px;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--now);box-shadow:0 0 0 4px var(--color-accent-color-2-lighter)}
.tl-now-label{position:absolute;left:-44px;top:-11px;font-size:11px;font-weight:700;color:var(--live-ink);background:var(--live);border-radius:6px;padding:1px 5px;white-space:nowrap}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--color-accent-color-2-light)}100%{box-shadow:0 0 0 10px transparent}}

/* attendance */
.att-week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.att-day{text-align:center;padding:8px 2px;border-radius:var(--r-label);background:var(--surface-2);color:var(--muted);display:flex;flex-direction:column}
.att-day strong{font-size:12px}
.att-day span{font-size:11px}
.att-day.is-present{background:var(--alert-success-light);color:var(--alert-success-dark)}

/* assignment */
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.file-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-card);background:var(--surface-2);border:1px solid var(--line)}
.input{width:100%;padding:11px 16px;border-radius:var(--r-card);border:1px solid var(--input-solid-border-default);background:var(--input-solid-bg-default);color:var(--input-text-default);font-size:15px;resize:vertical}
.input:hover{border-color:var(--input-solid-border-hover);background:var(--input-solid-bg-hover)}
.input:focus{border-color:var(--input-solid-border-focus);background:var(--input-solid-bg-focus);outline:none}
.input::placeholder{color:var(--input-text-muted)}
.select{max-width:380px;min-height:44px;border-radius:var(--r-input)}
.fs{border:0;padding:0;margin:0}
.success-mark{width:52px;height:52px;border-radius:50%;background:var(--alert-success-light);color:var(--alert-success-dark);display:flex;align-items:center;justify-content:center}
.next-box{width:100%;max-width:580px;padding:14px 16px;border-radius:var(--r-card);background:var(--surface-2)}
.next-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;flex-wrap:wrap}

/* courses */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.course-card{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface)}
.course-card-top{display:flex;gap:12px;align-items:center}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--progress-bar-progress-track);overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px;background:var(--progress-bar-progress-bar)}
.course-hero{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.course-hero .bar{max-width:420px}
.grade-box{padding:14px 18px;border-radius:var(--r-card);background:var(--surface-2);text-align:center;min-width:150px}
.grade-big{font-size:22px;font-weight:700;margin-top:2px}
.continue{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* week */
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.scroll-x{overflow-x:auto;padding-bottom:6px}
.week-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;min-width:860px}
.week-col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:12px;min-height:380px;display:flex;flex-direction:column;gap:8px}
.week-col.is-today{border-color:var(--brand-blue);border-width:2px;padding:11px}
.week-col-head{display:flex;align-items:baseline;gap:8px;padding:2px 4px 8px;border-bottom:1px solid var(--line)}
.today-pill{margin-left:auto;font-size:11px;font-weight:700;padding:1px 8px;border-radius:var(--r-label);background:var(--brand-blue);color:#fff}
.week-item{display:flex;flex-direction:column;gap:2px;width:100%;padding:10px;border:0;border-radius:var(--r-label);text-align:left;font-size:14px}
.week-item:hover{filter:brightness(.96)}
.week-item-kind{font-size:11px;font-weight:700}
.week-item-title{font-weight:600;line-height:1.3}

/* sessions list */
.sess-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 0;border-bottom:1px solid var(--line)}
.sess-row:last-child{border-bottom:0}
.sess-when{width:150px;flex-shrink:0;display:flex;flex-direction:column}

/* room */
.stage{aspect-ratio:16/9;width:100%;max-height:70vh;border-radius:var(--r-card);background:var(--foregrounds-and-backgrounds-background-color-dark);color:var(--typography-text-light);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.stage-avatar{width:96px;height:96px;border-radius:calc(var(--r-avatar)*2);background:var(--user-circle-user-circle-primary);color:var(--user-circle-user-circle-font);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700}

/* toggles */
.toggle-chip{min-height:40px;padding:6px 14px;border-radius:var(--r-tag);border:1px solid var(--line-2);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2)}
.toggle-chip.is-on{background:var(--select-bg);border-color:var(--select-bg);color:var(--select-ink)}
.pref-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.pref-head{font-size:13px;font-weight:700;color:var(--muted);padding:12px 0}
.pref-col{width:64px;display:flex;justify-content:center;flex-shrink:0}
.switch{width:48px;height:28px;border-radius:99px;border:1px solid var(--toggle-track-default-outline);padding:2px;background:var(--color-neutral-200);display:flex}
.switch span{width:22px;height:22px;border-radius:50%;background:var(--toggle-thumb-default);transition:transform .15s}
.switch:hover span{background:var(--toggle-thumb-hover)}
.switch.is-on{background:var(--toggle-toggle-active-bg);border-color:var(--toggle-toggle-active-border)}
.switch.is-on:hover{background:var(--toggle-toggle-hover-bg);border-color:var(--toggle-toggle-hover-border)}
.switch.is-on span,.switch.is-on:hover span{background:var(--toggle-thumb-active)}
.switch.is-on span{transform:translateX(20px)}

/* launch overlay */
.launch-overlay{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--subject-ink);color:var(--typography-text-light);animation:fadein .2s ease-out}
.launch-overlay .subject-tile{background:var(--subject);color:var(--subject-ink)}
.launch-bar{width:200px;height:4px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.launch-bar span{display:block;height:100%;width:0;background:#fff;animation:load .7s ease-out forwards}
@keyframes load{to{width:100%}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* player */
.player{min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.player-bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:10px 20px;background:var(--subject-ink);color:var(--typography-text-light)}
.player-bar-title{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:17px;flex:1}
.player-bar-title .subject-tile{background:var(--subject);color:var(--subject-ink)}
.player-bar-progress{font-size:13px;opacity:.9}
.player-body{display:flex;flex-wrap:wrap;flex:1;align-items:flex-start}
.player-outline{flex:1 1 260px;max-width:100%;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.outline-head{font-family:var(--display);font-weight:700;padding:0 10px 8px}
.outline-item{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:14px;color:var(--ink-2)}
.outline-item:hover{background:var(--hover)}
.outline-item.is-current{background:var(--subject-soft);color:var(--subject-ink);color:var(--ink);font-weight:700}
.outline-mark{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid var(--line-2);color:var(--muted)}
.outline-mark.is-done{background:var(--subject-ink);border-color:var(--subject-ink);color:var(--typography-text-light)}
.outline-item.is-current .outline-mark{border-color:var(--subject-ink);color:var(--subject-ink)}
.player-content{flex:999 1 520px;min-width:0;padding:32px 32px 80px}
.player-content>*{max-width:760px}
.player-outline{border-right:1px solid var(--line);align-self:stretch}
.player-h1{margin:0 0 14px;font-family:var(--display);font-size:clamp(26px,3.4vw,36px);line-height:1.15;letter-spacing:-.02em}
.player-lead{font-size:18px;line-height:1.65;max-width:62ch;color:var(--ink-2)}
.check-card{margin-top:28px;padding:22px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line)}
.check-h{margin:0;font-size:15px;font-weight:700;color:var(--muted)}
.check-q{margin-top:6px;font-size:17px;font-weight:600}
.check-opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{min-height:48px;padding:10px 14px;border-radius:var(--r-btn);border:1px solid var(--line-2);background:var(--surface);text-align:left;font-size:15px}
.opt:hover{border-color:var(--subject-ink);background:var(--hover)}
.opt.is-right{background:var(--alert-success-light);border-color:var(--alert-success-base);color:var(--alert-success-dark);font-weight:700}
.opt.is-wrong{background:var(--alert-error-light);border-color:var(--alert-error-base);color:var(--alert-error-dark)}
.check-fb{margin-top:12px;font-weight:700}
.player-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}

/* prototype controls */
.proto{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.proto-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--ink-2)}
.proto-panel{width:300px;max-width:calc(100vw - 32px);padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.proto-h{font-family:var(--display);font-weight:700;margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:36px;padding:4px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.is-on{background:var(--select-bg);border-color:var(--select-bg);color:var(--select-ink)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);padding:12px 18px;border-radius:var(--tooltip-tooltip-corner);background:var(--tooltip-tooltip-dark-bg);color:var(--tooltip-tooltip-dark-text);font-weight:600;box-shadow:var(--shadow);z-index:60}

@media (max-width:640px){
  .main{padding:18px 16px 96px}
  .topbar{padding:10px 14px}
  .player-content{padding:24px 18px 80px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

.circle-primary{background:var(--brand-blue);color:#fff}
.circle-secondary{background:var(--user-circle-user-circle-secondary);color:var(--color-secondary-darker)}
.work-due.tone-danger{color:var(--alert-error-dark)}
.work-due.tone-warn{color:var(--alert-warning-dark)}
.work-due.tone-neutral{color:var(--ink)}
body{color:var(--ink)}

.hero{padding:32px 32px 28px;border-radius:20px;background:linear-gradient(135deg,var(--hero-from),var(--hero-to));border:1px solid var(--line)}
.hero-eyebrow{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hero .lede{color:var(--ink-2);font-size:16px}
.main{background:var(--bg)}

.feed{display:flex;flex-direction:column;gap:8px}
.feed-item{display:flex;gap:10px;align-items:flex-start;padding:12px 6px 10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.feed-icon{width:28px;height:28px;flex-shrink:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.kind-announce .feed-icon{background:var(--brand-blue-soft);color:var(--brand-blue)}
.kind-feedback .feed-icon{background:var(--label-label-green-bg);color:var(--label-label-green-text)}
.kind-reminder .feed-icon{background:var(--label-label-yellow-bg);color:var(--label-label-yellow-text)}
.feed-meta{font-size:12px;color:var(--muted)}
.feed-title{font-weight:700;font-size:14px;line-height:1.35;margin-top:1px}
.feed-body{font-size:13px;color:var(--ink-2);margin-top:2px}
.feed-actions{display:flex;flex-wrap:wrap;gap:0 14px;margin-top:2px}
.feed-actions .link-btn{font-size:13px;padding:4px 0}
.muted-link{color:var(--muted)}
.icon-btn.sm{width:36px;height:36px}
.feed-more{align-self:flex-start;font-size:13px}
.feed-body{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* announcements carousel */
.ann{display:flex;gap:16px;align-items:flex-start;padding:18px 14px 14px 20px;border-radius:var(--r-card);background:var(--brand-blue-soft);border:1px solid var(--brand-blue-line)}
.ann-icon{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--brand-blue);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.ann-slide{animation:annIn .35s ease-out}
@keyframes annIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.ann-meta{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-blue-ink)}
.ann-title{font-size:18px;font-weight:800;margin-top:2px}
.ann-body{color:var(--ink-2);margin-top:2px}
.ann-dots{display:flex;gap:2px;margin-top:8px;margin-left:-10px}
.ann-dot{width:28px;height:28px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ann-dot span{width:8px;height:8px;border-radius:99px;background:var(--brand-blue-line);transition:width .2s}
.ann-dot.is-on span{width:22px;background:var(--brand-blue)}
.ann-ctrls{display:flex;gap:2px;flex-shrink:0}
.ann .icon-btn:hover{background:var(--brand-blue-line)}
.ann-min{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:var(--r-card);background:var(--brand-blue-soft);border:1px solid var(--brand-blue-line);font-size:14px}
.ann-min-icon{color:var(--brand-blue);display:inline-flex}
.ann-min .icon-btn:hover{background:var(--brand-blue-line)}
@media (max-width:640px){.ann{flex-wrap:wrap}.ann-ctrls{width:100%;justify-content:flex-end}}

/* up next */
.upnext{border-radius:var(--r-card);padding:20px;background:linear-gradient(135deg,var(--subject-soft),var(--surface) 70%);border:1px solid var(--line);margin-bottom:22px}
.upnext-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin-bottom:12px}
.upnext-label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--subject-ink)}
.upnext-why{font-size:13px;color:var(--ink-2)}
.upnext-body{display:flex;gap:16px;align-items:flex-start}
.upnext-title{margin:8px 0 4px;font-size:22px;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.upnext-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.upnext .btn-accent{padding:10px 22px}

/* rest list */
.rest-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.rest-title{margin:0;font-size:15px;font-weight:800}
.task-list{display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px 10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;transition:background .15s,border-color .15s}
.task:hover{background:var(--hover);border-color:var(--line-2)}
.task:hover .task-go{color:var(--ink);transform:translateX(2px)}
.task .subject-tile{width:36px;height:36px;font-size:13px;border-radius:10px}
.task-main{display:flex;flex-direction:column}
.task-title{font-weight:700;line-height:1.3}
.task-meta{font-size:13px;color:var(--muted)}
.task-due{font-size:13px;font-weight:800;min-width:64px;text-align:right}
.due-danger{color:var(--alert-error-dark)}.due-warn{color:var(--alert-warning-dark)}.due-neutral{color:var(--ink-2)}
.task-go{color:var(--muted);display:inline-flex;transition:transform .15s}
@media (max-width:640px){.task .chip{display:none}}

/* bell */
.bell-pop{width:380px;max-width:calc(100vw - 24px);max-height:70vh;overflow:auto;padding:8px}
.bell-head{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.bell-sec{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.bell-item{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:var(--r-menu-item)}
.bell-item:hover{background:var(--hover)}
.bell-item .grade-pill{width:60px}
.bell-empty{padding:12px 10px}

/* grade band switcher */
.band-k{font-weight:600;color:var(--muted);margin-right:2px}
.band-mark{min-width:44px;height:32px;padding:0 6px;border-radius:8px;background:var(--brand-blue-soft);color:var(--brand-blue-ink);font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center}

/* collapsible sidebar */
.side{position:relative;z-index:6;gap:14px;transition:flex-basis .2s ease}
.side-top{display:flex;justify-content:flex-end;margin:-12px -4px -6px}
.side-toggle{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:var(--surface)}
.side-sec{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:36px;padding:4px 10px 4px 0;border:0;background:transparent;border-radius:8px;text-align:left}
.side-sec:hover{background:var(--hover)}
.side-sec .side-h{margin:0 10px}
.side-chev{color:var(--muted);display:inline-flex;transform:rotate(-90deg);transition:transform .15s}
.side-chev.is-open{transform:rotate(0)}
.side-nav{padding-top:14px}
.nav-list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.side.is-min{flex:0 0 76px;padding:20px 12px;align-items:center}
.side.is-min .side-top{margin:-8px 0 0;justify-content:center}
.side.is-min .side-sec{display:none}
.side.is-min section,.side.is-min .side-nav{width:100%}
.side.is-min .launchers{margin-top:0;align-items:center}
.side.is-min .launcher{width:48px;height:48px;padding:0;justify-content:center}
.side.is-min .launcher .subject-tile{width:36px;height:36px;font-size:13px}
.side.is-min .launcher-text,.side.is-min .launcher-play,.side.is-min .nav-label{display:none}
.side.is-min .side-nav{padding-top:12px;align-items:center}
.side.is-min .nav-list{align-items:center;margin-top:0}
.side.is-min .nav-item{width:48px;height:48px;padding:0;justify-content:center}
.side [data-tip]{position:relative}
.side.is-min [data-tip]:hover::after,.side.is-min [data-tip]:focus-visible::after,.side-toggle:hover::after,.side-toggle:focus-visible::after{
  content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);
  white-space:nowrap;padding:6px 10px;border-radius:var(--tooltip-tooltip-corner);background:var(--tooltip-tooltip-dark-bg);color:var(--tooltip-tooltip-dark-text);
  font-size:13px;font-weight:600;line-height:1.3;box-shadow:var(--shadow);pointer-events:none;z-index:30}
.side:not(.is-min) .side-toggle:hover::after,.side:not(.is-min) .side-toggle:focus-visible::after{left:auto;right:calc(100% + 10px)}

/* compact greeting */
.greet{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:0 4px}
.greet-h{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.greet-sub{color:var(--muted);font-size:14px}

/* up next banner */
.upnext{position:relative;overflow:hidden;border-radius:20px;padding:26px 28px 24px;margin:0;background:linear-gradient(120deg,var(--subject-soft) 0%,var(--surface) 78%);border:1px solid var(--line)}
.upnext::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--subject-soft);opacity:.55;pointer-events:none}
.upnext>*{position:relative;z-index:1}
.upnext-top{margin-bottom:16px}
.upnext-label{font-size:13px}
.upnext-count{order:3;margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.upnext-tile{width:76px;height:76px;font-size:26px;border-radius:20px}
.upnext-title{margin:8px 0 4px;font-family:var(--display);font-weight:800;font-size:clamp(24px,2.6vw,30px);line-height:1.15;letter-spacing:-.015em}
.upnext-sub{font-size:15px;color:var(--ink-2)}
.upnext-body{gap:20px;align-items:center}
.upnext-actions{margin-top:20px}
.btn-lg{min-height:50px;padding:12px 26px;font-size:16px}
.col-main{gap:20px}

/* narrow (1/4) timeline */
.col-side .tl-rail,.col-side .tl-rail-past{left:42px}
.col-side .tl-hour span{width:36px;font-size:10.5px}
.col-side .tl-block{left:54px;padding:8px 8px 8px 10px}
.col-side .tl-dot{left:-17px}
.col-side .tl-now{left:30px}
.col-side .tl-now-label{left:-30px;font-size:10.5px;padding:1px 4px}
.col-side .tl-b-foot{gap:6px}
.col-side .tl-badge{font-size:10.5px;padding:1px 6px}
.col-side .btn-join{padding:2px 12px;min-height:30px;font-size:13px}
.col-side .card{padding:16px}
.col-side .card-head{margin:-16px -16px 12px;padding:12px 16px;flex-wrap:nowrap}

/* K-5 subject navigation */
.brand{border:0;background:transparent;padding:4px 6px 4px 0;border-radius:10px;text-align:left}
.k5-nav{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.k5-item{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:12px 8px 10px;border:2px solid transparent;border-radius:20px;background:transparent;transition:background .15s,border-color .15s,transform .15s}
.k5-item:hover{background:var(--subject-soft);transform:translateY(-1px)}
.k5-item:focus-visible{border-color:var(--subject-ink);outline:none}
.k5-item.is-active{background:var(--subject-soft);border-color:var(--subject)}
.k5-icon{width:76px;height:76px;border-radius:24px;display:inline-flex;align-items:center;justify-content:center;background:var(--subject-soft);color:var(--subject-ink);box-shadow:inset 0 -4px 0 var(--subject)}
.k5-item:hover .k5-icon{background:var(--surface)}
.k5-label{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.2;color:var(--ink)}
.k5-divider{height:1px;background:var(--line);margin:6px 8px}
.side:has(.k5-nav){flex:0 0 180px}
.side.is-min:has(.k5-nav){flex:0 0 96px}
.side.is-min .k5-label{display:none}
.side.is-min .k5-item{padding:6px}
.side.is-min .k5-icon{width:60px;height:60px;border-radius:18px}
.brand{display:flex;align-items:center;gap:10px}

/* 6-12: Campus links first */
.side-nav.is-first{padding-top:0;border-top:0}
.side-courses{padding-top:14px;border-top:1px solid var(--line)}
.side.is-min .side-courses{padding-top:12px}

/* K-5 teacher icon */
.k5-teacher{padding:0;overflow:hidden;background:var(--subject-soft)}
.k5-teacher svg{width:68px;height:68px}

/* K-5 Classes home */
.k5-home{max-width:1100px}
.k5-hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.k5-h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(28px,3.4vw,36px);line-height:1.1;letter-spacing:-.01em}
.k5-sub{font-size:17px;color:var(--ink-2);margin-top:4px}
.star-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--color-accent-color-3-subtle);border:2px solid var(--color-accent-color-3-light);font-size:15px;color:var(--color-accent-color-3-darker)}
.star-pill strong{font-size:24px;font-weight:900;line-height:1}
.star path{fill:var(--prim-slate-200);stroke:var(--prim-slate-300);stroke-width:1.2;stroke-linejoin:round}
.star.is-on path{fill:var(--color-accent-color-3-base);stroke:var(--color-accent-color-3-dark)}
.k5-day{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.k5-day-label{font-weight:800;font-size:15px}
.k5-day-track{flex:1;height:16px;border-radius:99px;background:var(--prim-slate-100);overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,23,42,.08)}
.k5-day-track span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--color-accent-color-4-base),var(--color-accent-color-4-dark));transition:width .4s ease}
.k5-day-n{font-weight:900;font-size:18px;min-width:44px;text-align:right}
.k5-live{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:18px;background:var(--brand-blue-soft);border:1px solid var(--brand-blue-line)}
.k5-live.is-live{background:var(--color-accent-color-2-subtle);border-color:var(--color-accent-color-2-light)}
.k5-live-when{font-size:14px;font-weight:700;color:var(--brand-blue-ink)}
.k5-live.is-live .k5-live-when{color:var(--color-accent-color-2-darker)}
.k5-live-title{font-size:18px;font-weight:800}
.k5-live-wait{font-weight:700;color:var(--muted)}
.k5-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.k5-card{display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:28px;background:var(--subject-soft);border:3px solid transparent;box-shadow:0 6px 0 var(--subject);transition:transform .15s}
.k5-card:hover{transform:translateY(-2px)}
.k5-card.is-done{border-color:var(--subject)}
.k5-card-top{display:flex;align-items:center;gap:14px}
.k5-card-icon{width:72px;height:72px;border-radius:22px;background:var(--surface);color:var(--subject-ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--subject)}
.k5-card-h{margin:0;font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1;color:var(--subject-ink)}
.k5-stars{display:flex;gap:3px;margin-top:6px}
.k5-badge{align-self:flex-start;padding:4px 12px;border-radius:999px;background:var(--surface);color:var(--subject-ink);font-weight:900;font-size:13px}
.k5-bar{height:14px;border-radius:99px;background:var(--surface);overflow:hidden}
.k5-bar span{display:block;height:100%;border-radius:99px;background:var(--subject-ink);transition:width .4s ease}
.k5-acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.k5-act{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:8px 12px;border:0;border-radius:14px;background:var(--surface);text-align:left;font-size:15px;font-weight:700;color:var(--ink)}
.k5-act:hover{box-shadow:0 0 0 2px var(--subject)}
.k5-act.is-done{background:transparent;color:var(--subject-ink);cursor:default;box-shadow:none}
.k5-check{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:2.5px solid var(--subject);display:inline-flex;align-items:center;justify-content:center;background:var(--surface)}
.k5-act.is-done .k5-check{background:var(--subject-ink);border-color:var(--subject-ink);color:#fff}
.k5-go{color:var(--subject-ink);display:inline-flex}
.k5-go svg{fill:currentColor}
.k5-play{align-self:flex-start;min-height:52px;padding:12px 26px;font-size:18px;font-weight:900;background:var(--subject-ink);color:#fff;border-radius:999px;box-shadow:0 4px 0 color-mix(in srgb,var(--subject-ink) 60%,#000)}
.k5-play svg{fill:currentColor}
.k5-play:hover{filter:brightness(1.2)}

/* Homeroom */
.homeroom{max-width:760px}
.hr-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.hr-feed{display:flex;flex-direction:column;gap:16px}
.hr-post{padding:20px;border-radius:22px;background:var(--surface);border:1px solid var(--line)}
.hr-post-top{display:flex;align-items:center;gap:12px}
.hr-kind{padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;background:var(--prim-slate-100);color:var(--prim-slate-700)}
.hr-kind.kind-morning{background:var(--color-accent-color-3-lighter);color:var(--color-accent-color-3-darker)}
.hr-kind.kind-shout-out{background:var(--color-accent-color-6-lighter);color:var(--color-accent-color-6-darker)}
.hr-kind.kind-reminder{background:var(--brand-blue-soft);color:var(--brand-blue-ink)}
.hr-text{font-size:18px;line-height:1.55;margin:14px 0 12px}
.hr-like{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800;color:var(--ink-2)}
.hr-like.is-on{border-color:var(--color-accent-color-6-base);background:var(--color-accent-color-6-subtle);color:var(--color-accent-color-6-darker)}
.hr-like.is-on svg{fill:var(--color-accent-color-6-base)}
.hr-n{font-weight:700;color:var(--muted)}
.k5-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.k5-grid{grid-template-columns:minmax(0,1fr)}}
.k5-play{margin-top:auto}

/* Quick launch: grade + course progress */
.launcher-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.launcher-grade{flex-shrink:0;font-size:12.5px;font-weight:800;color:var(--ink)}
.launcher-grade.is-none{font-weight:600;color:var(--muted);font-size:11.5px}
.launcher-prog{display:block;height:4px;border-radius:99px;background:var(--prim-slate-100);overflow:hidden;margin-top:6px}
.launcher-prog span{display:block;height:100%;border-radius:99px;background:var(--subject)}
.launcher{align-items:center}

/* Quick launch, two clean lines: name / grade + progress */
.launcher-text{gap:3px}
.launcher-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.launcher-meta{display:flex;align-items:center;gap:8px;min-width:0}
.launcher-meta .launcher-grade{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.launcher-meta .launcher-grade.is-none{font-weight:600;color:var(--muted);font-size:12px}
.launcher-meta .launcher-prog{flex:1;margin-top:0;height:4px;min-width:24px}
.launcher-play{width:28px!important;height:28px!important;background:transparent!important;color:var(--muted)!important}
.launcher:hover .launcher-play,.launcher:focus-visible .launcher-play{background:var(--subject-ink)!important;color:#fff!important}

/* grade tiles in Quick launch */
.grade-tile{position:relative;font-size:14px;letter-spacing:0}
.launcher .grade-tile{width:36px;height:36px;font-size:14px}
.grade-tile:hover::after{content:attr(data-grade-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);white-space:nowrap;padding:5px 9px;border-radius:var(--tooltip-tooltip-corner);background:var(--tooltip-tooltip-dark-bg);color:var(--tooltip-tooltip-dark-text);font-family:var(--body);font-size:12px;font-weight:700;box-shadow:var(--shadow);z-index:30;pointer-events:none}
.side.is-min .grade-tile:hover::after{display:none}

/* graduation plan */
.grad{max-width:1100px}
.grad-hero{display:flex;flex-direction:column;gap:16px}
.grad-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:700px){.grad-nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grad-big{font-family:var(--display);font-weight:900;font-size:34px;line-height:1.1}
.grad-prog-n{color:var(--prim-admin-blue-600)}
.grad-bar{display:flex;height:16px;border-radius:99px;background:var(--prim-slate-100);overflow:hidden}
.grad-bar.sm{height:8px;margin-top:8px}
.seg-earned{background:var(--color-accent-color-4-dark)}
.seg-prog{background:var(--prim-admin-blue-300)}
.seg-left{background:var(--prim-slate-200)}
.grad-legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted)}
.grad-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.grad-cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,2fr);gap:20px;align-items:start}
@media (max-width:900px){.grad-cols{grid-template-columns:minmax(0,1fr)}}
.grad-card-head{margin:-4px -20px 4px}
.req-row{padding:14px 0;border-bottom:1px solid var(--line)}
.req-row:last-child{border-bottom:0}
.req-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.next-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.next-steps li{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2)}
.ns-dot{width:8px;height:8px;border-radius:50%;background:var(--prim-admin-blue-500);margin-top:8px;flex-shrink:0}

/* Live today calendar strip */
.cal-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:0 0 10px}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--ink-2)}
.cal-day:hover{background:var(--hover)}
.cal-d{font-size:11px;font-weight:700;color:var(--muted)}
.cal-n{font-size:16px;font-weight:800;line-height:1.2}
.cal-dots{display:flex;gap:3px;height:5px}
.cal-dots i{width:5px;height:5px;border-radius:50%;background:var(--prim-admin-blue-400)}
.cal-day.is-today .cal-n{color:var(--prim-admin-blue-600)}
.cal-day.is-on{background:var(--select-bg);border-color:var(--select-bg);color:var(--select-ink)}
.cal-day.is-on .cal-d,.cal-day.is-on .cal-n{color:var(--select-ink)}
.cal-day.is-on .cal-dots i{background:var(--prim-admin-blue-200)}
.day-list{display:flex;flex-direction:column;gap:8px}
.day-item{display:flex;flex-direction:column;gap:3px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left}
.day-item:hover{background:var(--hover)}
.day-item-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.cal-all{width:100%;margin-top:12px}
.cal-strip{margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.cal-sessions{margin-top:32px;scroll-margin-top:16px}
.cal-sec-h{margin:0 0 14px;font-family:var(--display);font-weight:800;font-size:22px}

/* Up next spans the full width */
/* playlist list */
.task-list{gap:2px!important}
.pl-head{display:grid;grid-template-columns:36px minmax(0,1fr) 110px 84px;gap:12px;padding:0 12px 8px;margin-bottom:4px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pl-head span:last-child{text-align:right}
.pl-row{display:grid!important;grid-template-columns:36px minmax(0,1fr) 110px 84px;gap:12px;align-items:center;width:100%;padding:8px 12px!important;border:0!important;border-radius:12px!important;background:transparent!important;text-align:left}
.pl-row:hover,.pl-row:focus-visible{background:var(--hover)!important}
.pl-num{position:relative;display:flex;align-items:center;justify-content:center;height:36px;font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.pl-play{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--ink)}

.pl-row:hover .pl-n,.pl-row:focus-visible .pl-n{display:none}
.pl-row:hover .pl-play,.pl-row:focus-visible .pl-play{display:flex}
.pl-track{display:flex;align-items:center;gap:12px;min-width:0}
.pl-track .subject-tile{width:40px;height:40px;border-radius:10px}
.pl-track .task-main{display:flex;flex-direction:column;min-width:0}
.pl-track .task-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-type{display:flex}
.pl-row .task-due{text-align:right}
@media (max-width:640px){.pl-head{display:none}.pl-row{grid-template-columns:28px minmax(0,1fr) 64px}.pl-type{display:none}}
